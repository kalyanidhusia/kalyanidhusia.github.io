name: Refresh bio-arcade/survey/responses.csv

# Pulls every response from the Google Sheet collector (Apps Script web app) and commits
# bio-arcade/survey/responses.csv when it changed. Zero PII by design of the instrument.
# Requires repository secret SURVEY_COLLECT_URL = the Apps Script web app URL (…/exec).

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC (00:17 Central)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CSV from collector
        env:
          URL: ${{ secrets.SURVEY_COLLECT_URL }}
        run: |
          test -n "$URL" || { echo "SURVEY_COLLECT_URL secret is not set"; exit 1; }
          curl -sSL --fail "${URL}?format=csv" -o /tmp/responses.csv
          head -c 200 /tmp/responses.csv | grep -q '^server_ts,' || { echo "unexpected response from collector"; head -c 400 /tmp/responses.csv; exit 1; }
          mkdir -p bio-arcade/survey && cp /tmp/responses.csv bio-arcade/survey/responses.csv
          echo "rows: $(($(wc -l < bio-arcade/survey/responses.csv) - 1))"
      - name: Commit if changed
        run: |
          git config user.name "survey-bot"
          git config user.email "survey-bot@users.noreply.github.com"
          git add bio-arcade/survey/responses.csv
          git diff --cached --quiet && echo "no change" || git commit -m "survey: refresh responses.csv ($(date -u +%F))" && git push
