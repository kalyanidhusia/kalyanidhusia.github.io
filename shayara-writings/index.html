:root{color-scheme:dark;--bg:#17191b;--panel:#1c1f22;--line:#33363a;--ink:#f1ede4;--muted:#aaa9a4;--gold:#c9ac7b;--reading:780px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}a{color:var(--gold)}button{font:inherit}#app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}.sidebar{height:100vh;position:sticky;top:0;overflow:auto;background:#131517;border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column}.mark{font:italic 34px 'Libre Baskerville',serif;letter-spacing:-1px;color:var(--gold)}.strap{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:2.7px;margin:12px 0 36px}.nav-label{font-size:11px;letter-spacing:2px;color:#777b80;text-transform:uppercase;margin-bottom:13px}.tabs{display:grid;gap:4px}.tab{border:0;border-left:2px solid transparent;background:transparent;color:#b9b8b4;text-align:left;padding:13px 12px;cursor:pointer;border-radius:0 6px 6px 0;line-height:1.45}.tab:hover,.tab:focus-visible{background:#242628;color:#fff}.tab[aria-selected=true]{background:#282827;color:var(--gold);border-left-color:var(--gold)}.tab small{display:block;color:#888982;font-size:11px;margin-top:4px}.side-footer{margin-top:auto;padding-top:26px;font-size:12px;color:#848683;line-height:1.7}.side-footer a{color:#aaa9a4}.reader{min-width:0;padding:52px clamp(20px,6vw,92px) 110px}.topline{max-width:var(--reading);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:65px}.eyebrow{font-size:11px;color:var(--gold);letter-spacing:2.2px;text-transform:uppercase}.tools{display:flex;gap:7px;align-items:center}.tools button{background:transparent;border:1px solid #484a49;color:#c5c2bc;padding:7px 11px;border-radius:20px;cursor:pointer}.tools button:hover{border-color:var(--gold);color:var(--gold)}article{max-width:var(--reading);margin:auto;animation:rise .35s ease}h1{font:normal clamp(34px,4.5vw,62px)/1.2 'Libre Baskerville',Georgia,serif;letter-spacing:-1.8px;margin:0 0 20px}.date{color:#b2ada4;font-size:13px;letter-spacing:.8px}.hero{width:100%;max-height:490px;object-fit:contain;background:#202225;margin:35px 0 20px;border-radius:5px}.prose{font:17px/2 'Libre Baskerville',Georgia,serif;color:#e5dfd4;overflow-wrap:anywhere}.prose p{margin:0 0 1.55em}.prose .poem{white-space:pre-line}.prose em{font-style:italic;color:#d5c3a5}.prose blockquote{border-left:2px solid var(--gold);margin-left:0;padding:10px 24px;color:#cbbba5}.prose img{max-width:100%;height:auto;border-radius:4px}.prose iframe{max-width:100%}.prose audio,.prose video{max-width:100%;width:100%}.credit{border-top:1px solid var(--line);margin-top:65px;padding-top:22px;font-size:13px;color:var(--muted)}.notice{padding:22px 25px;border:1px solid #4d463a;background:#24231f;border-radius:6px;color:#d7cdbc;line-height:1.7}.empty{max-width:650px}.muted{color:var(--muted)}.mobile-menu{display:none}.landing{padding:40px 0}.landing-lead{font:italic 25px/1.7 'Libre Baskerville',Georgia,serif;color:#d0bb99;max-width:600px}.search{width:100%;background:#222528;border:1px solid #3f4245;color:#eee;padding:11px 12px;border-radius:5px;margin-bottom:18px}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:800px){#app{display:block}.sidebar{height:auto;position:static;padding:19px 17px;border-bottom:1px solid var(--line)}.mark{font-size:27px}.strap{margin:5px 0 9px}.nav-label,.side-footer{display:none}.mobile-menu{display:block;margin:8px 0;background:#2c2c2c;color:var(--ink);border:1px solid var(--line);padding:9px 12px;border-radius:4px}.tabs{display:none;max-height:45vh;overflow:auto}.sidebar.expanded .tabs{display:grid}.reader{padding:26px 20px 80px}.topline{margin-bottom:35px}.hero{margin-top:25px}.prose{font-size:15.5px;line-height:1.95}}

const EMBEDDED_POSTS=[ {"id": "knight", "title": "Knight in Shining Armour", "date": "2026-03-29", "slug": "knight-in-shining-armour", "url": "https://thecomearound.wordpress.com/2026/03/29/knight-in-shining-armour/"}, {"id": "choice", "title": "Choice That Most Can't Make at All", "date": "2026-05-07", "slug": "choice-that-most-cant-make-at-all", "url": "https://thecomearound.wordpress.com/2026/05/07/choice-that-most-cant-make-at-all/"}, {"id": "idiots", "title": "I'm Surrounded by Idiots", "date": "2026-06-29", "slug": "im-surrounded-by-idiots", "url": "https://thecomearound.wordpress.com/2026/06/29/im-surrounded-by-idiots/"}, {"id": "love-teeth", "title": "Love Has Teeth", "date": "2026-07-09", "slug": "love-has-teeth", "url": "https://thecomearound.wordpress.com/2026/07/09/love-has-teeth/"}, {"id": "sailing", "title": "Sailing Past the Song", "date": "2026-07-10", "slug": "sailing-past-the-song", "url": "https://thecomearound.wordpress.com/2026/07/10/sailing-past-the-song/"}, {"id": "trapped", "title": "Trapped", "date": "2026-07-30", "slug": "1584", "url": "https://thecomearound.wordpress.com/2026/07/30/1584/"}, {"id": "she-stands", "title": "She Stands", "date": "2026-08-17", "slug": "she-stands", "url": "https://thecomearound.wordpress.com/2026/08/17/she-stands/"}, {"id": "do-neem", "title": "Do Neem (The Split)", "date": "2026-09-04", "slug": "do-neem-the-split", "url": "https://thecomearound.wordpress.com/2026/09/04/do-neem-the-split/"}, {"id": "weight-coin", "title": "Weight of the Coin", "date": "2026-09-18", "slug": "weight-of-the-coin", "url": "https://thecomearound.wordpress.com/2026/09/18/weight-of-the-coin/"},{"id": "decree", "title": "Author of My Own Decree", "date": "2026-10-13", "slug": "author-of-my-own-decree", "url": "https://kalyanidhusia.github.io/shayara-writings/#decree"}];
const EMBEDDED_CONTENT={"knight": {"title": "Knight in shining armour", "date": "2026-03-29", "content": "\n<p class=\"wp-block-paragraph\">You came to my gate with a trader\u2019s intent, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Wrapped in the shining armor that was only a foil.</p>\n\n\n\n<p class=\"wp-block-paragraph\">A polished surface, thin and crinkled, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Hiding a heart that sought only to spoil. </p>\n\n\n\n<p class=\"wp-block-paragraph\">You wanted the crown, the mortgage, the Amen, </p>\n\n\n\n<p class=\"wp-block-paragraph\">King of the castle, you didn\u2019t even build; </p>\n\n\n\n<p class=\"wp-block-paragraph\">Demanding the respect again and again, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Until the free will I carried was stilled.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But this is the week of the humble entry<strong>,</strong> </p>\n\n\n\n<p class=\"wp-block-paragraph\">And I\u2019ve learned the difference in the shadows of the palms. </p>\n\n\n\n<p class=\"wp-block-paragraph\">The world waited for a Cavalry, a Sentry, </p>\n\n\n\n<p class=\"wp-block-paragraph\">For silver-clad soldiers and war-beating psalms. </p>\n\n\n\n<p class=\"wp-block-paragraph\">They wanted a King on a stallion of gold, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Someone to mirror their pride and their scars\u2014 </p>\n\n\n\n<p class=\"wp-block-paragraph\">But the True One arrived on a beast, I am told, </p>\n\n\n\n<p class=\"wp-block-paragraph\">With no need for mirrors, or status, or gold.</p>\n\n\n\n<p class=\"wp-block-paragraph\">You mistook my &#8220;Yes&#8221; for a land to be conquered, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Like the Company men on a rich Indian shore. </p>\n\n\n\n<p class=\"wp-block-paragraph\">You signed your name to the peace that I offered, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Then called it sanctification while you asked for more. </p>\n\n\n\n<p class=\"wp-block-paragraph\">You preached a gospel of submit and obey, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Using the Father to mask your own ego\u2014 </p>\n\n\n\n<p class=\"wp-block-paragraph\">But the King on the donkey shows a different way: </p>\n\n\n\n<p class=\"wp-block-paragraph\">He doesn&#8217;t need subjects to make His grace grow.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The Free Pass is over. The treaty is torn. </p>\n\n\n\n<p class=\"wp-block-paragraph\">The 6:30 runner is reclaiming the street. </p>\n\n\n\n<p class=\"wp-block-paragraph\">A sovereign nation is finally reborn, </p>\n\n\n\n<p class=\"wp-block-paragraph\">With the dust of your proxy kicked off of her feet. </p>\n\n\n\n<p class=\"wp-block-paragraph\">For aluminum shrivels when the Truth gets too bright, </p>\n\n\n\n<p class=\"wp-block-paragraph\">And you failed to die for your church from the start. </p>\n\n\n\n<p class=\"wp-block-paragraph\">I\u2019m trading the foil for the Morning Light, </p>\n\n\n\n<p class=\"wp-block-paragraph\">And the King on the donkey for my own healed heart.</p>\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/03/29/knight-in-shining-armour/"}, "choice": {"title": "Choice that most can\u2019t make at all&#8230;", "date": "2026-05-07", "content": "\n<div class=\"wp-block-group has-global-padding is-layout-constrained wp-block-group-is-layout-constrained\">\n<blockquote class=\"wp-block-quote is-layout-flow wp-block-quote-is-layout-flow\">\n<p class=\"wp-block-paragraph\"><em>Jaan kehne se koi Jaan nhi hota hai,</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><em>Haan ji &#8230; Jaan kehne se koi Jaan nhi hota hai,</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><em>Koi keh le bhi nuksaan nhi hota hai !!!</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><em>Ye toh mai hoon, k jise chhod diya.. chhod diya</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><em>Ye toh mai hoon, k jise chhod diya.. chhod diya</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><em>Varna ye faisla aasan nhi hota hai !!!</em></p>\n</blockquote>\n</div>\n\n\n\n<p class=\"wp-block-paragraph\">Just because you called me &#8220;love&#8221; don\u2019t think you held my soul, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Words are cheap, and breath is easy\u2014an effortless role. </p>\n\n\n\n<p class=\"wp-block-paragraph\">There is no wound in a title, no scar in a hollow name, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Anyone can whisper sacrifice, while they\u2019re exiting the frame.</p>\n\n\n\n<p class=\"wp-block-paragraph\">There is no cost to a whisper, no tax on a lie, </p>\n\n\n\n<p class=\"wp-block-paragraph\">To call someone love as you wave them goodbye.</p>\n\n\n\n<p class=\"wp-block-paragraph\">You think you walked away, but I\u2019m the one who let you go. </p>\n\n\n\n<p class=\"wp-block-paragraph\">I watched you choose the easy path, </p>\n\n\n\n<p class=\"wp-block-paragraph\">and I didn&#8217;t say no. </p>\n\n\n\n<p class=\"wp-block-paragraph\">It takes a certain kind of woman to let a bridge simply burn, </p>\n\n\n\n<p class=\"wp-block-paragraph\">To stand amidst the falling ash and never once look back or turn.</p>\n\n\n\n<p class=\"wp-block-paragraph\">If it were any other, they\u2019d have shattered at your feet, </p>\n\n\n\n<p class=\"wp-block-paragraph\">They\u2019d have filled the air with salt and tears to make the loss complete. They would have begged, and screamed, and pleaded for the &#8220;us&#8221; we used to be\u2014 </p>\n\n\n\n<p class=\"wp-block-paragraph\">But that\u2019s a brand of desperation that was never meant for me.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Don\u2019t mistake my steady hands for a heart that doesn&#8217;t feel, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Or think that being &#8220;left&#8221; has made my spirit any less real. </p>\n\n\n\n<p class=\"wp-block-paragraph\">I simply have too much pride to fight for a space you didn&#8217;t give, </p>\n\n\n\n<p class=\"wp-block-paragraph\">And too much fire in my blood to beg for the right to live.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Go on and tell your story\u2014tell them that the break was light, </p>\n\n\n\n<p class=\"wp-block-paragraph\">That I was cold, or reached the end, or didn&#8217;t put up a fight. </p>\n\n\n\n<p class=\"wp-block-paragraph\">But keep this truth behind your teeth: </p>\n\n\n\n<p class=\"wp-block-paragraph\">you only survived the fall, </p>\n\n\n\n<p class=\"wp-block-paragraph\">Because I\u2019m the one who made a choice that most can\u2019t make at all.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n", "image": "https://thecomearound.wordpress.com/wp-content/uploads/2026/05/1778280780887.png", "source": "https://thecomearound.wordpress.com/2026/05/07/choice-that-most-cant-make-at-all/"}, "idiots": {"title": "I&#8217;m surrounded by idiots!?", "date": "2026-06-29", "content": "\n<p class=\"wp-block-paragraph\">Kaya was taking a peaking into this world of humans on her travels and was captivated by this tale for human offsprings. </p>\n\n\n\n<figure class=\"wp-block-image size-large\"><a href=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg\"><img data-attachment-id=\"1544\" data-permalink=\"https://thecomearound.wordpress.com/2026/06/29/im-surrounded-by-idiots/images-1/\" data-orig-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg\" data-orig-size=\"323,156\" data-comments-opened=\"1\" data-image-title=\"images (1)\" data-image-description=\"\" data-image-caption=\"\" data-large-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=323\" loading=\"lazy\" width=\"323\" height=\"156\" src=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=323\" alt=\"\" class=\"wp-image-1544\" srcset=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg 323w, https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=150 150w, https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=300 300w\" sizes=\"auto, (max-width: 323px) 100vw, 323px\" /></a></figure>\n\n\n\n<p class=\"wp-block-paragraph\">Maybe Scar&#8217;s quote resonated and captured that specific, deeply frustrating feeling of being the only one in the room who actually sees the big picture while everyone else is just fumbling around.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Kaya did not hate people. Hating people required a level of emotional investment she simply couldn\u2019t afford to waste. No, Kaya\u2019s affliction was much heavier, much more exhausting: she was simply, undeniably, surrounded by idiots.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She stood in the pristine, limestone archives of the High Cartography Institute, adjusting her magnifying loupe over a massive maritime chart. Around her, senior cartographers fumbled with delicate parchment and leaked standard charcoal ink over the borders as if they were wearing winter mittens. Kaya was the sharpest mind in the sector, a woman who had braved social norms to master the invisible laws of geography, terrain, and the precise, mathematical ratios of her own secret, no-spill ink.</p>\n\n\n\n<p class=\"wp-block-paragraph\">And yet, every single day, she had to watch people smudge the lines.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Her phone vibrated against the marble counter. A message from the border transit office.</p>\n\n\n\n<p class=\"wp-block-paragraph\">&gt; **TRANSIT COURIER REGISTRY:** *Application Denied. Reason: Invalid Sector Coordinates.*</p>\n\n\n\n<p class=\"wp-block-paragraph\">&gt;&nbsp;</p>\n\n\n\n<p class=\"wp-block-paragraph\">Kaya closed her eyes, the rustle of a hundred heavy parchment maps around the room suddenly sounding like a collective, mocking laugh.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She had spent six figures in local credits\u2014essentially her entire savings from her last major expedition\u2014to secure Sovereign Passports and premium airship transit tokens for her parents and siblings. She wanted them to see her world. She wanted them to stand in the grand archives and finally understand the magnitude of the charts she created.</p>\n\n\n\n<p class=\"wp-block-paragraph\">All they had to do was fill out a single, standard form. The coordinates of her institute were plastered on the front page of every major civic directory. It was a five-second lookup. Instead, they had guessed. They had written down a completely different district, misspelling the sector name entirely.</p>\n\n\n\n<p class=\"wp-block-paragraph\">*I am surrounded by idiots,* her mind whispered, the phrase striking like a clean, dull hammer.</p>\n\n\n\n<p class=\"wp-block-paragraph\">It wasn\u2019t anger; it was the suffocating, hollow realization that they didn&#8217;t even care enough to look. They were content to stay in their small, dusty village, blind to the wild tides of the world, entirely incurious about the girl who mapped the stars.</p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;Kaya? Are you listening to me?&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">She opened her eyes. Standing across the plotting table was Julian, her partner. He was currently holding a beautifully cured leather scroll casing\u2014one he had completely sliced open by using the wrong boundary blade. He looked at her with the wide, helpless eyes of a child who had just dropped a glass jar.</p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;I tried to trim the borders like you asked,&#8221; Julian mumbled, shifting his weight. &#8220;But it tore. You knew how I was with the delicate leather when you chose to partner with me. Why are you acting so cold about it now?&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">Kaya stared at him. This was his favorite defensive shield. *You knew how I was.* A grown man whose entire strategy in a partnership was to weaponize his own incompetence so she would sigh, take the blades from his hands, and do the plotting for him. He didn\u2019t want to learn; he wanted a caretaker to fix his mistakes.</p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;Clean it up, Julian,&#8221; she said, her voice terrifyingly quiet.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She walked out of the drafting hall, her boots clicking sharply against the stone floor. She needed air. She needed a break from the gravity of everyone else&#8217;s laziness.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But the world outside offered no sanctuary. She owned a small residential complex down the road, a property she managed completely on her own to secure her financial independence. Just this morning, her tenants had sent a formal grievance because the courtyard vines were &#8220;too difficult to prune.&#8221; They expected her\u2014a woman mapping the uncharted territories of the empire\u2014to come over with shears and trim their walkways because basic yard work felt like an impossible riddle to them.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She marched toward the Guild Director\u2019s office to clear her head with raw geographical data. The Director, a man whose title vastly outpaced his intellect, looked up from his heavy mahogany desk.</p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;Ah, Kaya,&#8221; he smiled, a patronizing, slow expression. &#8220;I saw your petition for the Senior Research Track. Fascinating work on the deep-sea topography grids. Truly intelligent.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;Thank you, Director. I assume the board approved the promotion?&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">The Director chuckled, leaning back. &#8220;Oh, we can&#8217;t do that. You see, the Senior Track is a permanent guild line. We don&#8217;t expect highly intelligent, hyper-capable people like yourself to actually stay with a company like ours for the long haul. You&#8217;ll catch a bigger wind, find a grander expedition, and leave us. So, we&#8217;re keeping you right where you are.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">Kaya\u2019s breath caught in her throat. The room felt suddenly devoid of oxygen. It was a gilded cage. She was being punished for her excellence, held back because she was too good at her job, while the mediocre pool around her floated effortlessly to the top.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Desperate for some semblance of grounding, Kaya took the evening transport to the coastal edge of the city to visit her Elder Guardians\u2014the sweet, traditional couple she had adopted as her chosen family. They lived in a beautiful, secluded cottage on the rocky shore, safe from the chaotic politics of the inner city. She thought they, at least, would offer a sanctuary of love.</p>\n\n\n\n<p class=\"wp-block-paragraph\">They sat on the porch, watching the waves crash against the jagged rocks below. Kaya tried to explain the suffocating weight of her week, the isolation of doing everything alone, the desire to find something bigger.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The matriarch adjusted her knitted shawl, her face full of gentle, smothering pity. </p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;<em>Oh, my dear Kaya. </em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><em>This is what happens when you try to brave the wild waters of the world. The modern era is full of chaos. If an alliance or a career doesn&#8217;t come directly from a secluded, traditional arrangement from the supreme force\u2014if it isn&#8217;t brought to you safely by the community\u2014it is bound to be corrupt. You must stay on the shore where it&#8217;s safe.</em>&#8220;</p>\n\n\n\n<p class=\"wp-block-paragraph\">Kaya looked out at the raging ocean. Her knuckles turned white against her teacup reminding of the &#8220;Pearls don&#8217;t lie on the seashore. If you want one, you must dive for it&#8221; she picked from human world. She wanted to respond but it would only make her only family-like visits sour. Maybe she is has had too much influence of this world, doubted Kaya for a minute.</p>\n\n\n\n<p class=\"wp-block-paragraph\">They were well-meaning wardens, but wardens nonetheless. They sat comfortably on the dry sand, never once dipping their toes into the freezing, violent depths, completely unaware that you have to actually survive the terrifying heights of the water if you ever want to reach down and grasp the pearl. They wanted her small as she was growing up. They wanted her compliant, which gave them pride to call her their own. Did they wanted her to mistake safety for peace?</p>\n\n\n\n<p class=\"wp-block-paragraph\">The phrase returned, louder this time, a steady, rhythmic pulse in her temples.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong><em>I am surrounded by idiots.</em></strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">The weight of their collective inadequacy pressed down on her chest like a concrete block. She was the one paying the credits, she was the one pulling the late nights, she was the one whose precise lines kept the trade ships from crashing into reefs\u2014and yet she was entirely, profoundly alone in the dark.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Kaya stood up, setting her teacup down with a sharp clink. She looked at the gentle, smiling faces of her guardians, then turned her gaze back toward the glittering, chaotic lights of the city.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The realization had fully set in, crushing and absolute. </p>\n\n\n\n<p class=\"wp-block-paragraph\">No one was coming to save her. </p>\n\n\n\n<p class=\"wp-block-paragraph\">No one was going to help her pull the weight.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Fine ! If she had to carry the world on her back, she would do it. </p>\n\n\n\n<p class=\"wp-block-paragraph\">But she was done pretending the anchors around her ankles were family.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/06/29/im-surrounded-by-idiots/"}, "love-teeth": {"title": "Love has teeth!", "date": "2026-07-09", "content": "\n<figure class=\"wp-block-image size-large\"><a href=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png\"><img data-attachment-id=\"1557\" data-permalink=\"https://thecomearound.wordpress.com/2026/07/09/love-has-teeth/attachment/1783643840589/\" data-orig-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png\" data-orig-size=\"848,1264\" data-comments-opened=\"1\" data-image-title=\"1783643840589\" data-image-description=\"\" data-image-caption=\"\" data-large-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=687\" loading=\"lazy\" width=\"687\" height=\"1024\" src=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=687\" alt=\"\" class=\"wp-image-1557\" srcset=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=687 687w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=101 101w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=201 201w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=768 768w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png 848w\" sizes=\"auto, (max-width: 687px) 100vw, 687px\" /></a></figure>\n\n\n\n<p class=\"wp-block-paragraph\">The cedar handle of the charting brush creaked under the pressure of Kaya\u2019s grip. She didn&#8217;t realize she was doing it until her knuckles flared stark white against the wood. Across the room, the faint, maddening sound of Julian humming a mindless tune scraped against her nerves like glass on stone. He had just ruined a second vellum scroll by spilling water across the ink-lines, and his immediate response had been a helpless, defensive shrug.&nbsp;<em>\u201cYou know how clumsy I am with liquid measures, Kaya. You shouldn&#8217;t have left it on my bench.\u201d</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bA familiar, bitter heat surged from her chest to her jaw. Kaya clenched her teeth so hard her molars ached.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b<em>I am surrounded by idiots.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bFor months, that phrase had been her silent shield. It was the armor she put on every morning to survive the suffocating weight of her life. She had used it to rationalize her family\u2019s careless disregard when they botched the coordinates she paid six figures for. She had used it to numb the pain when her Director blocked her promotion because she was &#8220;too intelligent to risk losing.&#8221; She had used it to endure her Elder Guardians\u2019 soft, paralyzing lectures about staying safe on the shore.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bBut as she stood there, watching Julian casually walk away from the mess he expected her to clean, the armor shattered.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bIt wasn&#8217;t a shield anymore. It was a mirror.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bWith a sudden, jarring clarity, Kaya realized the terrifying truth: the &#8220;pressured-love&#8221; she had been practicing was a lie. She had been taught that to be good, to be noble, to be a protector, meant keeping the peace. It meant smiling through the incompetence, absorbing the chaos of others, and quietly redrawing the maps they ruined so the guild wouldn&#8217;t collapse.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bIt wasn&#8217;t virtue. It was a hostage situation. And she was the one volunteering to stay in the cell.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bThe sheer weight of the others emotions she had been tolerating rushed over her. By pretending relationships were fine while the evil charade unfolded, she hadn&#8217;t been preserving peace\u2014she had been funding her own slow, psychological death. She felt secure in her routine, yes, but she felt entirely, utterly dead.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bHer fist clenched tightly around the brush, the wood groaning a final warning before it snapped neatly in two.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bThe sharp&nbsp;<em>crack</em>&nbsp;echoed through the silent drafting hall. Julian startled, turning around. &#8220;Kaya? What was that?&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bKaya didn&#8217;t answer. She dropped the broken pieces of the brush onto the table. The heat in her chest suddenly cooled into something terrifyingly sharp, clinical, and absolute. The honest person inside her finally woke up:&nbsp;<em>soulless conformity never leads to life-giving change.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;I\u2019m not cleaning it,&#8221; Kaya said, her voice dropping to a calm, dead pan.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bJulian blinked, confused. &#8220;What? But the ink will stain the cedar if it sets\u2014&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;Then let it stain,&#8221; she interrupted, stepping out from behind her desk. For the first time, she didn&#8217;t soften her posture. She didn&#8217;t sigh and reach for the cloth. She let the mess exist. She let\u00a0<em>his</em>\u00a0failure belong entirely to\u00a0<em>him</em>.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe walked past him without a glance, heading straight for the grand archive doors. She could feel the anchors pulling at her ankles\u2014the thought of her disappointed parents, her patronizing Director, her suffocating guardians\u2014but the ropes were fraying.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bTo hate what is wrong meant she had to stop participating in the illusion. If they wanted to live in a world of self-inflicted chaos, they were welcome to it. But they would no longer use her as their safety net.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bKaya reached into her pocket, her fingers brushing against the cold glass vial of her secret, un-spillable ink. She didn&#8217;t need to fight them. She didn&#8217;t need to argue, or scream, or demand they understand her worth. She just had to stop carrying them.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe opened the heavy oak doors, stepping out into the bright, biting air of the city, leaving the midday work behind. </p>\n\n\n\n<p class=\"wp-block-paragraph\">If she had to brave the wild tides to get the pearl, she would do it completely alone\u2014and for the first time in years, her jaw was unlocked, her hands were open, and she could finally breathe.</p>\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/07/09/love-has-teeth/"}, "sailing": {"title": "Sailing past the Song", "date": "2026-07-10", "content": "\n<figure class=\"wp-block-image size-large\"><a href=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg\"><img data-attachment-id=\"1563\" data-permalink=\"https://thecomearound.wordpress.com/2026/07/10/sailing-past-the-song/img-20260710-wa00101/\" data-orig-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg\" data-orig-size=\"1024,1024\" data-comments-opened=\"1\" data-image-meta=\"{&quot;orientation&quot;:&quot;1&quot;}\" data-image-title=\"IMG-20260710-WA0010(1)\" data-image-description=\"\" data-image-caption=\"\" data-large-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=1024\" loading=\"lazy\" width=\"1024\" height=\"1024\" src=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=1024\" alt=\"\" class=\"wp-image-1563\" srcset=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg 1024w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=150 150w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=300 300w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=768 768w\" sizes=\"auto, (max-width: 1024px) 100vw, 1024px\" /></a></figure>\n\n\n\n<p class=\"wp-block-paragraph\">They crowned my head with silver crowns of reason,</p>\n\n\n\n<p class=\"wp-block-paragraph\">They called me brilliant, excellent, and wise.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But &#8220;intelligent&#8221; became a gilded prison,</p>\n\n\n\n<p class=\"wp-block-paragraph\">That hid the softer hunger in my eyes.</p>\n\n\n\n<p class=\"wp-block-paragraph\">No one ever paused to call me pretty,</p>\n\n\n\n<p class=\"wp-block-paragraph\">No one ever called me soft or sweet;</p>\n\n\n\n<p class=\"wp-block-paragraph\">I was the fortress of a cold and clever city,</p>\n\n\n\n<p class=\"wp-block-paragraph\">With heavy iron boots upon my feet.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bI never learned the art of being small,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Of being playful, childish, or severe.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I was the one who had to know it all,</p>\n\n\n\n<p class=\"wp-block-paragraph\">The razor mind that conquered every fear.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But inside the fortress, hidden in the dark,</p>\n\n\n\n<p class=\"wp-block-paragraph\">A girl\u2019s desires whispered like a prayer:</p>\n\n\n\n<p class=\"wp-block-paragraph\">To be a woman, leaving just a mark</p>\n\n\n\n<p class=\"wp-block-paragraph\">Of helpless, joyful laughter in the air.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bI thought&nbsp;<em>you</em>&nbsp;were the key to unlock the gate,</p>\n\n\n\n<p class=\"wp-block-paragraph\">The man who\u2019d let my heavy armor slide.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I thought with you, I\u2019d finally find the weight</p>\n\n\n\n<p class=\"wp-block-paragraph\">Of girlish sweetness that I had to hide.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I wanted to be childish, wild, and free,</p>\n\n\n\n<p class=\"wp-block-paragraph\">To be held tightly when the day was done\u2014</p>\n\n\n\n<p class=\"wp-block-paragraph\">To have you look at me and only see</p>\n\n\n\n<p class=\"wp-block-paragraph\">A woman, cute and pretty, in the sun.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But here the great and tragic storm awoke,</p>\n\n\n\n<p class=\"wp-block-paragraph\">The paradox of Solomon\u2019s decree:</p>\n\n\n\n<p class=\"wp-block-paragraph\">I could advise the world, break every yoke,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Yet built a cage for my own sovereignty.</p>\n\n\n\n<p class=\"wp-block-paragraph\">My daytime mind could map a corporate throne,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And hand you business plans of flawless art,</p>\n\n\n\n<p class=\"wp-block-paragraph\">But in the night, I sat entirely alone,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And used that brilliant mind to wreck my heart.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bBecause I craved to feel that girlish grace,</p>\n\n\n\n<p class=\"wp-block-paragraph\">My logic turned into a traitor&#8217;s knife.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I saw your empty hands, your cold embrace,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And used my intellect to shield your life.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I did the math to justify the text,</p>\n\n\n\n<p class=\"wp-block-paragraph\">I cooked the meals, I froze the ice cream tight,</p>\n\n\n\n<p class=\"wp-block-paragraph\">I thought,&nbsp;<em>&#8220;If I am wise, I can fix what happens next,&#8221;</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">And rationalized away your systemic slight.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bMy shortcomings were just my virtues spun\u2014</p>\n\n\n\n<p class=\"wp-block-paragraph\">My hope, my naive love, my deep desire.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I used my PhD to prove you were the one,</p>\n\n\n\n<p class=\"wp-block-paragraph\">While you were setting all my gifts on fire.</p>\n\n\n\n<p class=\"wp-block-paragraph\">A queen who ruled the data and the chart,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Blinded by a simple, girlish plea\u2014</p>\n\n\n\n<p class=\"wp-block-paragraph\">I was the wisest guide to someone else&#8217;s heart,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And the executioner of me.</p>\n\n\n\n<p class=\"wp-block-paragraph\">So now, the realization strikes the bone,</p>\n\n\n\n<p class=\"wp-block-paragraph\">I cannot trust the girl who wants the kiss.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The Siren song of wanting to be known</p>\n\n\n\n<p class=\"wp-block-paragraph\">Will pull me back into the dark abyss.</p>\n\n\n\n<p class=\"wp-block-paragraph\">My empathy is where the trap is set,</p>\n\n\n\n<p class=\"wp-block-paragraph\">My longing to be held will make me yield;</p>\n\n\n\n<p class=\"wp-block-paragraph\">So I must forge a pact I won&#8217;t forget,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And lock my softest self behind a shield.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bI plug my ears with beeswax to the strain</p>\n\n\n\n<p class=\"wp-block-paragraph\">Of phantom promises and foil design.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I bind my hands with heavy, iron chains,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And tie my body to the sovereign line.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The 6:30 routine is now the rope,</p>\n\n\n\n<p class=\"wp-block-paragraph\">The silent border is the unyielding mast\u2014</p>\n\n\n\n<p class=\"wp-block-paragraph\">I fasten down the anchors of my hope,</p>\n\n\n\n<p class=\"wp-block-paragraph\">To drown the hollow echoes of the past.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bMy heart will scream and beg to be untied,</p>\n\n\n\n<p class=\"wp-block-paragraph\">It wants the messy bun, the twirl, the shirt.</p>\n\n\n\n<p class=\"wp-block-paragraph\">It wants to believe the parasite that lied,</p>\n\n\n\n<p class=\"wp-block-paragraph\">To trade its freedom for a familiar hurt.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But Ulysses is captain of the sea,</p>\n\n\n\n<p class=\"wp-block-paragraph\">The ropes will cut, the bleeding hands will hold.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I sail past the song that almost ruined me,</p>\n\n\n\n<p class=\"wp-block-paragraph\">A brilliant woman\u2014pretty, fierce, and bold.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bThe plates are cleared. The clock has struck the hour.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The little girl has stepped out of the wild.</p>\n\n\n\n<p class=\"wp-block-paragraph\">You didn&#8217;t give her love or give her power\u2014</p>\n\n\n\n<p class=\"wp-block-paragraph\">But the Father holds the woman and lifts the child.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/07/10/sailing-past-the-song/"}, "trapped": {"title": "Trapped", "date": "2026-07-30", "content": "\n<p class=\"wp-block-paragraph\">For six years, the home world had a reliable pulse for Dory. Every single day, without exception, her husband had looked at her and told her he loved her. It was a constant, predictable law of her universe, as certain as gravity. His love was a quiet room, a steady hand, and a lifetime of built safety.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Yet, sitting there with him in the gentle warmth of their home, the conversation turned toward the dark, unmapped terrain of her childhood. The trauma of an abused child doesn&#8217;t disappear just because adult life becomes gentle; in the warmth of his consistency, the old coldness felt even sharper.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bThe memory didn&#8217;t fade with time; it just sat beneath the surface of her skin, waiting.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bDory had been an accident of birth, a conception that forced two people into a bitter, early marriage. Her mother&#8217;s response to that trapped life was a cold, unyielding hatred. From the very beginning, Dory was entirely rejected, passed through the uncaring hands of orphanages and two separate foster homes. But the deepest scars were carved in the quiet darkness of a lonely apartment in Oakland, California.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bAt only six years old, Dory already carried the crushing weight of a grown woman&#8217;s grief. Her world was defined by waiting in the darkness for her mother to return late at night. Her primary responsibility was protecting her younger sister, Marie. The cruelty of the rejection crystallized in the moments the front door finally clicked open. Her mother would step across the threshold, immediately gathering Marie into a warm, loving hug. When Dory stepped forward, yearning for the same warmth, she was always shoved aside\u2014unwanted, like a stray dog left out in the rain.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe learned early that the sharp, hollow ache of an empty stomach was easier to bear than the emotional devastation of being hated by the person who gave her life. She was never lovingly touched, held, or cuddled. What she knew was different, ugly, and a burden to her mother.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bThe apex of the terror came on the nights her mother brought male companions home. To ensure no one would discover that a child was left behind alone, her mother resorted to a clinical, horrifying routine. She would pull the heavy wall bed down, stuff six-year-old Dory into the dark, cramped cavity behind it, and slam the bed back up into the wall. Trapped in the suffocating, dusty void, Dory would cry, gasping for air and clawing at the dark until she finally fell asleep.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bWhen she turned seven, the abandonment became absolute. Her mother took Marie and Dory to an orphanage nearby and dropped them there like a package at the door. Over the next seven years, she visited them only twice, bringing a gift only for Marie, and none for Dory.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bStranded in the institution, Dory took out all her anger on the other children, earning a bad reputation and receiving a beating usually before bedtime every evening for seven years.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bBut when she was thirteen, a brief flicker of hope arrived. Some Christian students came to tell them about Jesus. As they were leaving, one of them said,&nbsp;<em>\u201cChildren, even if you forget everything else we have told you, remember God loves you.\u201d</em>&nbsp;Sitting on a folding chair in the parlor, Dory prayed for the first time in her life. She told God that if he loved her and wanted her, he could have her. On that special day, she thought she became a Christian.&nbsp;<em>\u201cI knew I was received by God,\u201d</em>&nbsp;she would later say.&nbsp;<em>\u201cAt last, I had a friend, a friend forever.\u201d</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bBut little did she realize, for the first time in her life outside the orphanage, that the world would be far worse for her than it was within the walls.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe was shunted to four different foster homes. In two of them, she was physically, mentally, and sexually abused. Yet, the religious narrative she had been handed insisted that the God who was with her during her closing days in the orphanage stood with her still.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bNow, sitting across from her husband, the teacup rattled against its saucer as Dory set it down. The house was quiet, but her eyes were fixed on the wall, staring right through the present into the dark.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;They told me He was a warrior,&#8221; Dory said, her voice dropping to a harsh, skin-scraping whisper. &#8220;Those students gave me a book filled with a God who breaks things to save the people who cry out to Him. He is the Lord who parted the Red Sea to swallow an entire Egyptian army. He commanded the sun to stand still for Joshua. He shut the mouths of starved lions for Daniel, and stood in the blazing Babylonian furnace so Shadrach, Meshach, and Abednego walked out without even the smell of smoke. He sent an earthquake to shatter the foundations of a prison to free Paul and Silas.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe turned her gaze to her husband, her eyes fiercely, terribly awake.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;If He could rip open the sea, manipulate the cosmos, tame wild beasts, cool the molecular heat of fire, and shatter prison iron\u2014then stopping the hands of vile men in a foster home should have required less than a whisper. Why didn\u2019t He? If He could part the ocean for a million strangers, why couldn&#8217;t He just lock a bedroom door for one little girl who trusted Him?&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bHer husband didn&#8217;t offer a platitude. He just held her gaze, letting the heavy truth sit between them.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;The typical answer,&#8221; Dory whispered, her jaw tightening, &#8220;is that He was suffering with me. But that is a lie for cowards. A friend who stands by and watches you get broken because it&#8217;s part of some grand, invisible equation isn&#8217;t a friend at all. That is an accomplice.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe looked down at her hands, the illusion finally shattering completely under the weight of honest psychology.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;This God is no better than an imaginary friend,&#8221; she said, the words cutting through the quiet room like a scalpel. &#8220;The psychology says that when you fear and go through immense trauma that your brain cannot bear, so in order to protect itself from going insane and losing the grasp of reality, it creates an imaginary situation or a person or anything imaginary where it can feel the comfort and love and all the lackings that it that a person is not receiving. So what is to say that God is just an imaginary construct or any better than that?&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe looked at her husband, the clinical truth giving her a cold, unbreakable clarity.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;It\u2019s called structural dissociation. My brain fractured itself to keep me from shattering. It created a fantasy defense\u2014an inner sanctuary with an imaginary guardian\u2014because the alternative was total psychological death. My cognitive architecture was just trying to detect a protector in an empty room because it was hardwired to survive. It wasn&#8217;t the Holy Spirit visiting a thirteen-year-old girl; it was a traumatized ego deploying every defense mechanism it had left.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe let out a long, slow breath, her shoulders dropping as the ancient, cosmic guilt poured out of her.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;I didn&#8217;t survive because of a miracle,&#8221; Dory said, looking her husband dead in the eye, finally claiming her own immense, terrifying strength. &#8220;My brain did what it had to do to keep that little girl in the wall bed from breaking. He didn&#8217;t keep me safe. I kept me safe. My own mind fought for me until I was strong enough to walk out of the dark and find a reality that was finally real.&#8221;\u200b</p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;This God is no better than an imaginary friend,&#8221; she said, the words cutting through the quiet room like a scalpel. &#8220;The psychology says that when you fear and go through immense trauma that your brain cannot bear, so in order to protect itself from going insane and losing the grasp of reality, it creates an imaginary situation or a person or anything imaginary where it can feel the comfort and love and all the lackings that it that a person is not receiving. So what is to say that God is just an imaginary construct or any better than that?&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe looked at her husband, the clinical truth giving her a cold, unbreakable clarity.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;It\u2019s called structural dissociation. My brain fractured itself to keep me from shattering. It created a fantasy defense\u2014an inner sanctuary with an imaginary guardian\u2014because the alternative was total psychological death. My cognitive architecture was just trying to detect a protector in an empty room because it was hardwired to survive. It wasn&#8217;t the Holy Spirit visiting a thirteen-year-old girl; it was a traumatized ego deploying every defense mechanism it had left.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe let out a long, slow breath, her shoulders dropping as the ancient, cosmic guilt poured out of her.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200b&#8221;I didn&#8217;t survive because of a miracle,&#8221; Dory said, looking her husband dead in the eye, finally claiming her own immense, terrifying strength. &#8220;My brain did what it had to do to keep that little girl in the wall bed from breaking. He didn&#8217;t keep me safe.&nbsp;<em>I</em>&nbsp;kept me safe. My own mind fought for me until I was strong enough to walk out of the dark and find a reality that was finally real.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;They will tell you there is proof,&#8221; Dory said, her voice rising slightly, carrying the weight of decades of reading, researching, and trying to make the pieces fit. &#8220;Apologists point to the geography of the Levant as if a map is an validation of a miracle. They tell you to look at the Jordan River where Jesus was baptized, or the dry stones of Israel where he walked. They point to the gnarled, ancient roots of the Garden of Gethsemane where he wept before the crucifixion.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bShe gestured out the window, as if pointing to the thousands of libraries across the world. &#8220;I looked into it. I read their proofs. They will give you endless coordinates:</p>\n\n\n\n<ul class=\"wp-block-list\">\n<li>\u200bThe&nbsp;<strong>Pool of Siloam</strong>&nbsp;in Jerusalem, where the blind man supposedly washed and gained his sight.</li>\n\n\n\n<li>\u200bThe rocky hill of&nbsp;<strong>Golgotha</strong>, the place of the skull, where the crosses physically stood.</li>\n\n\n\n<li>\u200bThe ancient town of&nbsp;<strong>Capernaum</strong>, the ruins of the synagogue where he cast out spirits.</li>\n\n\n\n<li>\u200bThe&nbsp;<strong>Sea of Galilee</strong>, a real, wind-swept body of water where fishermen cast their nets.</li>\n\n\n\n<li>\u200bThe&nbsp;<strong>Church of the Holy Sepulchre</strong>, built over the very tomb they claim was left empty.</li>\n</ul>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bThey look at these real, physical places and say,&nbsp;<em>&#8216;See? The setting is real, so the magic must be real too.&#8217;</em>&#8220;</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bDory leaned forward, her fingers tapping the wooden table with a sharp, rhythmic finality. &#8220;But that is a flaw in elementary logic. Because if real geography proves a god, then every god on earth is alive.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bLook at the Indian subcontinent. The&nbsp;<strong>Ram Setu</strong>, the chain of limestone shoals stretching between the southern tip of India and Sri Lanka, is entirely real\u2014visible from satellites, exactly where the ancient Hindu epics said Rama built a bridge to rescue his wife. If we travel across India, we find the pillars of&nbsp;<strong>Mahabalipuram</strong>, the sacred banks of the&nbsp;<strong>Varanasi Ghats</strong>&nbsp;along the Ganges where rituals have burned for millennia, the ancient caves of&nbsp;<strong>Kedarnath</strong>&nbsp;hidden high in the Himalayas, and the ruins of&nbsp;<strong>Ayodhya</strong>. If a physical landmark proves a theological claim, then the entire Hindu pantheon must be ruling the cosmos right now.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bAnd what of Islam?&nbsp;<strong>Mecca and Medina</strong>&nbsp;are absolute realities. The&nbsp;<strong>Kaaba</strong>&nbsp;stands in the center of the Grand Mosque, a physical focal point for billions. Millions of pilgrims march between the hills of&nbsp;<strong>Safa and Marwa</strong>, retracing the desperate search of Hagar for water. They gather at the&nbsp;<strong>Mount of Arafat</strong>, the very hill where Muhammad delivered his farewell sermon. They walk the plains of&nbsp;<strong>Mina</strong>&nbsp;and visit the ancient&nbsp;<strong>Well of Zamzam</strong>, which still flows with water today. By the same logic, the text of the Quran is validated purely because the sand and the stones are where they said they were.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bGo further east to Buddhism. The ancient&nbsp;<strong>Maha Bodhi Temple in Bodh Gaya</strong>&nbsp;stands precisely where Siddhartha Gautama sat under the Bodhi tree and achieved enlightenment. The ruins of the&nbsp;<strong>Jetavana monastery</strong>&nbsp;in Sravasti, where the Buddha spent most of his monastic life, are excavated and real. You can walk through&nbsp;<strong>Sarnath</strong>, the deer park where he preached his very first sermon, visit the&nbsp;<strong>Dhamekh Stupa</strong>&nbsp;built to mark the spot, and touch the stone ruins of&nbsp;<strong>Kushinagar</strong>, the physical place where he died.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bEven Jainism, rooted in deep antiquity, leaves an undeniable physical footprint. The massive stone temples of&nbsp;<strong>Dilwara</strong>&nbsp;are carved into the rocks of Mount Abu. The ancient monolithic statue of&nbsp;<strong>Bahubali at Shravanabelagola</strong>&nbsp;has stood for over a thousand years, carved out of a single granite hill. Pilgrims climb the rugged peaks of&nbsp;<strong>Shikharji</strong>, the holy mountain where twenty of the twenty-four Tirthankaras achieved liberation from the cycle of rebirth.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bEvery single belief system has its landmarks,&#8221; Dory whispered, her eyes dark and steady. &#8220;Every religion has its rivers, its mountains, its footprints in the mud, and its ancient ruins. The geography is real because humans live in a real world. We build altars where we suffer, and we give divine names to the mountains we climb.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bBut a real river does not mean a man walked on water. A real mountain does not mean a god spoke from a cloud. And the existence of Israel or Mecca or a bridge in the ocean doesn&#8217;t change the fact that when a child was screaming for help in a locked room, the sky was completely empty.&#8221;</p>\n\n\n\n<p class=\"wp-block-paragraph\">Dory&#8217;s husband couldn&#8217;t muster to say anything reasonable or logical, to counter her but only stretched out his hands </p>\n\n\n\n<p class=\"wp-block-paragraph\">around her waist </p>\n\n\n\n<p class=\"wp-block-paragraph\">pulling her close, </p>\n\n\n\n<p class=\"wp-block-paragraph\">leaning his head against hers and </p>\n\n\n\n<p class=\"wp-block-paragraph\">mumbling the words </p>\n\n\n\n<p class=\"wp-block-paragraph\">&#8220;Our father who art in heaven&#8230;&#8221;</p>\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/07/30/1584/"}, "she-stands": {"title": "She stands &#8230;", "date": "2026-08-17", "content": "\n<p class=\"wp-block-paragraph\">So back she goes to her old ways,</p>\n\n\n\n<p class=\"wp-block-paragraph\">&nbsp;of&nbsp;<span style=\"font-size: inherit\">fending for herself,</span></p>\n\n\n\n<p class=\"wp-block-paragraph\">defending for herself,</p>\n\n\n\n<p class=\"wp-block-paragraph\">laughing at herself,</p>\n\n\n\n<p class=\"wp-block-paragraph\">crying by herself,</p>\n\n\n\n<p class=\"wp-block-paragraph\">shutting everything and</p>\n\n\n\n<p class=\"wp-block-paragraph\">everyone out,</p>\n\n\n\n<p class=\"wp-block-paragraph\">hurt them before they hurt her.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She may have not known real joy or happiness</p>\n\n\n\n<p class=\"wp-block-paragraph\">before but now she is stripped off of</p>\n\n\n\n<p class=\"wp-block-paragraph\">any hope.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Jesus Christ was her one last hope and she</p>\n\n\n\n<p class=\"wp-block-paragraph\">did everything with her faith firm in this</p>\n\n\n\n<p class=\"wp-block-paragraph\">relationship,&nbsp;</p>\n\n\n\n<p class=\"wp-block-paragraph\">being firm to love someone</p>\n\n\n\n<p class=\"wp-block-paragraph\">broken and invalid,&nbsp;</p>\n\n\n\n<p class=\"wp-block-paragraph\">loving despite her&nbsp;<span style=\"font-size: inherit\">brokenness and incapacity.</span></p>\n\n\n\n<p class=\"wp-block-paragraph\">Now all that is gone.</p>\n\n\n\n<p class=\"wp-block-paragraph\">And she stands&#8230;&nbsp;</p>\n\n\n\n<p class=\"wp-block-paragraph\">to bear the burden</p>\n\n\n\n<p class=\"wp-block-paragraph\">to stand against him and</p>\n\n\n\n<p class=\"wp-block-paragraph\">strip him of the power of love she</p>\n\n\n\n<p class=\"wp-block-paragraph\">once surrendered happily and willingly</p>\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/08/17/she-stands/"}, "do-neem": {"title": "Do Neem (The Split)", "date": "2026-09-04", "content": "\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>\u200bDuniya ne sikhaya ki aurat ko batna padta hai,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Apni hi rooh ke do hisse karke jeena padta hai.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">She was told She must divide her life in two,</p>\n\n\n\n<p class=\"wp-block-paragraph\">To pick which half of her gets to survive.</p>\n\n\n\n<hr class=\"wp-block-separator has-alpha-channel-opacity\" />\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Ya toh naram hawayein chuno, jinme zindagi ki barish na ho,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Ya sang-e-marmar ki aisi chhat, jahan dhadkan ki gunjaish na ho.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">To choose a gentle hand that has no path,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Or a sturdy roof where no love can thrive.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bWith one, the night was warm, the words were soft,</p>\n\n\n\n<hr class=\"wp-block-separator has-alpha-channel-opacity\" />\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>\u200bEk shakhs mila, jiske lafz shabnam aur raatein makhmal thi,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Usne maathe ki shikan toh choom li, par sehar ka bojh mujh par chhod diya.</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Usne haath toh thama, par zindagi ki gadi mujh par chhod di,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Uske be-fikr aangan ko roshan rakhne ki khatir, maine apne wajood ko jala diya.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">He held my heart, but left my hands to build.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I carried all the weight, the bills, the home,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Until the warmth we had was slowly chilled.</p>\n\n\n\n<hr class=\"wp-block-separator has-alpha-channel-opacity\" />\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>\u200bDoosra woh tha, jiske sange-marmar mahal ki deewarein Unchi thi,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Duniya ne uske rutbe aur sone ke darwazon par salam kiya.</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Par us aali-shaan thikane mein, meri rooh barf mein tabdeel ho gayi,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Usne aasaish toh di, par meri  befikre masoomiyat ko dafan kar diya.</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Woh rishta nahi, dilon ka nahi, bas ek kaagzi sauda sa tha,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Aur main us sangemarmar ke qile mein, ek sangemarmar ki malka thi.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">With the other, all on the papers looked so right,</p>\n\n\n\n<p class=\"wp-block-paragraph\">A house of stone, a title, and a name.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But inside those walls, the air grew ice,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And my gentle free spirit was bound inside.</p>\n\n\n\n<hr class=\"wp-block-separator has-alpha-channel-opacity\" />\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>\u200bZamana kehta hai, aaj ki kaabil aurat ka yahi naseeb hai</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Ya mohabbat ke badle apna khoon-paseena girwi rakh de, </em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>ya hifazat ke badle apne jazbaat.</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Aur main in aade-adhure paimanon ke beech ghutti rahi,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Ek jahan jo muqammal hone ki zid karta tha, is fareb mein tadapta rahi.</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">They said:&nbsp;<em>&#8220;A woman cannot have it all\u2014</em></p>\n\n\n\n<p class=\"wp-block-paragraph\"><em>Settle for a lover, or settle for a cage.&#8221;</em></p>\n\n\n\n<p class=\"wp-block-paragraph\">And so I suffocated in the split,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Trapped between the warmth and the page.</p>\n\n\n\n<hr class=\"wp-block-separator has-alpha-channel-opacity\" />\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>\u200bPar ab, kisi khokhli neev par mera aashiyana nahi banega,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Kisi thande saaye ko garmi dene ke liye, mera aansoo nahi jalega.</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Na main bojh uthaungi, na kisi pinjre mein saans rok kar baithungi,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Maine aadhe aasmaan se samjhauta karna chhod diya hai.</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>\u200bMujhe mazboot chhat k sath thikana bhi chahiye, aur sardi ki dhoop si narmi bhi,</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Jo ishq aurat ko tod de, bahaane banaye, woh meri manzil nahi.</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Ab yeh safar aakhiri sach ki taraf mudega</em></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\"><em>Ya toh muqammal milega, ya yeh ladki khud apni mehboob rahegi.</em></p>\n\n\n\n\n\n\n\n<p class=\"wp-block-paragraph\">It looked so right,<br>A house of stone, a title, and a name.<br>But inside those walls, the air grew ice,<br>And my gentle free spirit was bound inside.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The world says this is the fate of today\u2019s capable woman:<br>She must either mortgage her blood and sweat in exchange for love,<br>Or mortgage her emotions in exchange for safety.<br>And I suffocated between these half-baked standards,<br>Agonizing in the delusion of a world that insisted on calling itself complete.</p>\n\n\n\n<p class=\"wp-block-paragraph\">They said: \u201cA woman cannot have it all\u2014<br>Settle for a lover, or settle for a cage.\u201d<br>And so I suffocated in the split,<br>Trapped between the warmth and the page.</p>\n\n\n\n<p class=\"wp-block-paragraph\">But now, my nest will not be built on a hollow foundation,<br>Nor will my tears burn to warm a cold shadow.<br>I will neither carry the burden nor sit breathless in a cage,<br>I have stopped compromising for half a sky.</p>\n\n\n\n<p class=\"wp-block-paragraph\">I need a home with a sturdy roof, but also the softness of winter sunshine,<br>The love that breaks a woman and makes excuses is not my destination.<br>Now this journey will turn toward the ultimate truth\u2014<br>Either I will get what is complete, or this girl will remain her own beloved.</p>\n", "image": "https://thecomearound.wordpress.com/wp-content/uploads/2026/09/1788554528532.png", "source": "https://thecomearound.wordpress.com/2026/09/04/do-neem-the-split/"}, "weight-coin": {"title": "Weight of the coin.", "date": "2026-09-18", "content": "\n<p class=\"wp-block-paragraph\"></p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">\u200b\u201cMaangan gaye so mar rahe, mare jo maangan jaahi\u2026\u201d</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">(Those who go to beg are dying, and dead are those who beg&#8230;  -Kabir)</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">\u200b</p>\n\n\n\n<p class=\"wp-block-paragraph\">She was taught early that a stretched hand is a broken spine,</p>\n\n\n\n<p class=\"wp-block-paragraph\">That taking favors from the world will blur the sovereign line.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She knew that for a woman in this world, </p>\n\n\n\n<p class=\"wp-block-paragraph\">charity always comes with a cage.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bNow the seals of the windows are cracking, </p>\n\n\n\n<p class=\"wp-block-paragraph\">winter is creeping in.</p>\n\n\n\n<p class=\"wp-block-paragraph\">The house is unkept, the bills sit heavy on the wooden table,</p>\n\n\n\n<p class=\"wp-block-paragraph\">A quiet, suffocating mountain she no longer feels able to move.</p>\n\n\n\n<p class=\"wp-block-paragraph\">And standing at the edge of these ruins is the man who broke the home,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Holding out a quiet coin, offering to pay the toll.</p>\n\n\n\n<p class=\"wp-block-paragraph\">when the bond was alive, she carried her weight,</p>\n\n\n\n<p class=\"wp-block-paragraph\">She paid the price of his presence, she managed the estate.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Now he wishes to returns as a savior, </p>\n\n\n\n<p class=\"wp-block-paragraph\">offering cash for the breaking walls,</p>\n\n\n\n<p class=\"wp-block-paragraph\">And the torment inside her fractures every time he calls.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bOh, the body begs to take it. </p>\n\n\n\n<p class=\"wp-block-paragraph\">The exhaustion is so deep.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She desperately wants to be cared for, she wants to finally sleep.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She craves the relief of a man who steps in to fix the leak,</p>\n\n\n\n<p class=\"wp-block-paragraph\">To feel the comfort of support, to be allowed to just be weak.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bBut the coin in his hand does not look like love. </p>\n\n\n\n<p class=\"wp-block-paragraph\">It looks like a master\u2019s chain.</p>\n\n\n\n<p class=\"wp-block-paragraph\">How do you accept an umbrella from the man who summoned the rain?</p>\n\n\n\n<p class=\"wp-block-paragraph\">Her principles rise up, rigid and cruel in her defense.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She cannot take his money without swallowing her soul,</p>\n\n\n\n<p class=\"wp-block-paragraph\">She cannot buy her comfort by paying his hidden toll.</p>\n\n\n\n<p class=\"wp-block-paragraph\">\u200bIt is a terrible, lonely curse to be a woman made of self-respect.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She wants the help so badly, she could weep on the open floor,</p>\n\n\n\n<p class=\"wp-block-paragraph\">But her hands refuse to reach for the charity at the door.</p>\n\n\n\n<p class=\"wp-block-paragraph\">She will fix the broken seals with her own bleeding hands,</p>\n\n\n\n<p class=\"wp-block-paragraph\">Starving in her sovereignty, exactly where she stands.</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Khuddari Aur Khairat<br>Kabir ke dohe gungunati hui badi hui thi woh,</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Ek sookhi, par oonchi anaa pe khadi hui thi woh.</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Kyunki duniya jab madad karti hai, toh keemat rooh ki maangti hai</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Ghar ki chhat tapak rahi hai, deewaron par silan ka raaj hai.</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">\u200bKal tak jo humari kamayi se ghar chala raha tha,</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Aaj woh meri bebasi par mujhe khairat baantne chala hai.</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Dil cheekh kar kehta hai, bas ab aur bojh mat utha.</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Ek pal ko lagta hai uske diye hue paise rakh loon,</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Is toote hue aashiyane ki bikharti neev kass loon.</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Zaroorat aur usoolon ki is khaufnaak jung mein,</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Jism rehm ki bheekh mangta hai, </p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">par zameer baghawat kar deta hai</p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">Faake manzoor hain, </p>\n\n\n\n<p class=\"has-text-align-right wp-block-paragraph\">tapakti chhat manzoor hai, par uski reham ki bheekh nahi.</p>\n\n\n\n<p class=\"wp-block-paragraph\"></p>\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/09/18/weight-of-the-coin/"}, "decree": {"title": "Author of My Own Decree", "date": "2026-10-13", "content": "<p>A spoken word video reflection on reclaiming authority, self-sovereignty, and writing one\u2019s own narrative beyond past expectations.</p><p><video controls preload=\"metadata\" width=\"100%\"><source src=\"Author_of_My_Own_Decree.mp4\" type=\"video/mp4\">Your browser does not support playing this video directly.</video></p>", "image": "", "source": "https://kalyanidhusia.github.io/shayara-writings/#decree"}};
const $=id=>document.getElementById(id), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prettyDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
function sanitize(html){const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');doc.querySelectorAll('script,style,form,button,object,embed,link,meta').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(el=>{for(const a of [...el.attributes]){if(a.name.startsWith('on')||a.name==='srcdoc'||(a.name==='style'&&!/^(text-align|white-space):/i.test(a.value)))el.removeAttribute(a.name);if(['href','src','poster'].includes(a.name)&&/^\s*(javascript|data):/i.test(a.value))el.removeAttribute(a.name);}if(el.tagName==='A'){el.target='_blank';el.rel='noopener noreferrer'}});return doc.body.firstElementChild.innerHTML;}
async function getJSON(url){const r=await fetch(url,{mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
async function loadPost(p){if(EMBEDDED_CONTENT[p.id])return EMBEDDED_CONTENT[p.id];try{const v=await getJSON('data/'+p.id+'.json');if(v.content)return v;}catch(e){};
 const api=[`${BASE}/wp-json/wp/v2/posts?slug=${encodeURIComponent(p.slug)}&_embed=1`, `https://public-api.wordpress.com/rest/v1.1/sites/thecomearound.wordpress.com/posts/slug:${encodeURIComponent(p.slug)}`];
 for(let i=0;i<api.length;i++){try{const d=await getJSON(api[i]);if(i===0){const x=Array.isArray(d)?d[0]:null;if(!x?.content?.rendered)continue;return {content:x.content.rendered,title:x.title?.rendered,date:x.date,image:x._embedded?.['wp:featuredmedia']?.[0]?.source_url||null,live:true};}else if(d?.content)return {content:d.content,title:d.title,date:d.date,image:d.featured_image||null,live:true};}catch(e){console.warn('Post source unavailable',p.slug,e.message);}}
 return null;}
function drawTabs(){const query=$('search').value.toLowerCase();$('tabs').innerHTML=posts.filter(p=>p.title.toLowerCase().includes(query)).map(p=>`<button class="tab" role="tab" aria-selected="${p.id===chosen}" data-id="${escapeHTML(p.id)}"><span>${escapeHTML(p.title)}</span><small>${prettyDate(p.date)}</small></button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.id)));}
async function navigate(id){const p=posts.find(p=>p.id===id)||posts[0];if(!p)return;chosen=p.id;history.replaceState(null,'','#'+p.id);drawTabs();$('sidebar').classList.remove('expanded');$('toggleMenu').setAttribute('aria-expanded','false');$('content').innerHTML=`<article><div class="eyebrow">Poetry · prose · reflections</div><h1>${escapeHTML(p.title)}</h1><div class="date">${prettyDate(p.date)}</div><p class="muted">Loading the writing…</p></article>`;
 const v=await loadPost(p);if(chosen!==p.id)return;
 const title=v?.title?new DOMParser().parseFromString(v.title,'text/html').body.textContent:p.title;
 const srcLink=`<a href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">Original WordPress publication ↗</a>`;
 if(!v){$('content').innerHTML=`<article class="empty"><div class="eyebrow">Collected writing</div><h1>${escapeHTML(p.title)}</h1><div class="date">${prettyDate(p.date)}</div><div class="notice" style="margin-top:35px">This post could not be retrieved from WordPress. The tab is ready, but its full text has not been stored locally yet. ${srcLink}<p>For a permanent independent copy, run the included <code>scripts/snapshot.py</code> on a computer with internet access, then commit the generated <code>data/</code> files.</p></div></article>`;return;}
 const body=sanitize(v.content);const hasImage=/<img/i.test(body);const hero=v.image&&!hasImage?`<img class="hero" src="${escapeHTML(v.image)}" alt="Artwork for ${escapeHTML(title)}" loading="lazy">`:'';
 $('content').innerHTML=`<article><div class="eyebrow">Collected writing</div><h1>${escapeHTML(title)}</h1><div class="date">${prettyDate(p.date)}</div>${hero}<div class="prose" id="postText" style="font-size:${fontSize}px">${body}</div><div class="credit">Written by Shayara · ${srcLink}${v.live?' <span class="muted">· Loaded from original publication</span>':''}</div></article>`;
}
function init(){posts=EMBEDDED_POSTS;drawTabs();navigate(location.hash.slice(1)||posts[0].id)}
$('search').addEventListener('input',drawTabs);$('toggleMenu').addEventListener('click',()=>{const expanded=$('sidebar').classList.toggle('expanded');$('toggleMenu').setAttribute('aria-expanded',String(expanded))});$('smaller').onclick=()=>{fontSize=Math.max(14,fontSize-1);if($('postText'))$('postText').style.fontSize=fontSize+'px'};$('larger').onclick=()=>{fontSize=Math.min(25,fontSize+1);if($('postText'))$('postText').style.fontSize=fontSize+'px'};$('share').onclick=()=>{navigator.clipboard?.writeText(location.href).then(()=>{$('share').textContent='Copied ✓';setTimeout(()=>$('share').textContent='Share ↗',1400)}).catch(()=>{prompt('Copy this link:',location.href)})};window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));init();
</script></body></html>
