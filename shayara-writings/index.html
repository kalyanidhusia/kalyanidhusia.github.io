on:rise .35s ease}h1{font:normal clamp(34px,4.5vw,62px)/1.2 'Libre Baskerville',Georgia,serif;letter-spacing:-1.8px;margin:0 0 20px}.date{color:#b2ada4;font-size:13px;letter-spacing:.8px}.hero{width:100%;max-height:490px;object-fit:contain;background:#202225;margin:35px 0 20px;border-radius:5px}.prose{font:17px/2 'Libre Baskerville',Georgia,serif;color:#e5dfd4;overflow-wrap:anywhere}.prose p{margin:0 0 1.55em}.prose .poem{white-space:pre-line}.prose em{font-style:italic;color:#d5c3a5}.prose blockquote{border-left:2px solid var(--gold);margin-left:0;padding:10px 24px;color:#cbbba5}.prose img{max-width:100%;height:auto;border-radius:4px}.prose iframe{max-width:100%}.prose audio,.prose video{max-width:100%;width:100%}.credit{border-top:1px solid var(--line);margin-top:65px;padding-top:22px;font-size:13px;color:var(--muted)}.notice{padding:22px 25px;border:1px solid #4d463a;background:#24231f;border-radius:6px;color:#d7cdbc;line-height:1.7}.empty{max-width:650px}.muted{color:var(--muted)}.mobile-menu{display:none}.landing{padding:40px 0}.landing-lead{font:italic 25px/1.7 'Libre Baskerville',Georgia,serif;color:#d0bb99;max-width:600px}.search{width:100%;background:#222528;border:1px solid #3f4245;color:#eee;padding:11px 12px;border-radius:5px;margin-bottom:18px}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:800px){#app{display:block}.sidebar{height:auto;position:static;padding:19px 17px;border-bottom:1px solid var(--line)}.mark{font-size:27px}.strap{margin:5px 0 9px}.nav-label,.side-footer{display:none}.mobile-menu{display:block;margin:8px 0;background:#2c2c2c;color:var(--ink);border:1px solid var(--line);padding:9px 12px;border-radius:4px}.tabs{display:none;max-height:45vh;overflow:auto}.sidebar.expanded .tabs{display:grid}.reader{padding:26px 20px 80px}.topline{margin-bottom:35px}.hero{margin-top:25px}.prose{font-size:15.5px;line-height:1.95}}

const EMBEDDED_POSTS=[{"id": "knight", "title": "Knight in Shining Armour", "date": "2026-03-29", "slug": "knight-in-shining-armour", "url": "https://thecomearound.wordpress.com/2026/03/29/knight-in-shining-armour/"}, {"id": "choice", "title": "Choice That Most Can't Make at All", "date": "2026-05-07", "slug": "choice-that-most-cant-make-at-all", "url": "https://thecomearound.wordpress.com/2026/05/07/choice-that-most-cant-make-at-all/"}, {"id": "idiots", "title": "I'm Surrounded by Idiots", "date": "2026-06-29", "slug": "im-surrounded-by-idiots", "url": "https://thecomearound.wordpress.com/2026/06/29/im-surrounded-by-idiots/"}, {"id": "love-teeth", "title": "Love Has Teeth", "date": "2026-07-09", "slug": "love-has-teeth", "url": "https://thecomearound.wordpress.com/2026/07/09/love-has-teeth/"}, {"id": "sailing", "title": "Sailing Past the Song", "date": "2026-07-10", "slug": "sailing-past-the-song", "url": "https://thecomearound.wordpress.com/2026/07/10/sailing-past-the-song/"}, {"id": "trapped", "title": "Trapped", "date": "2026-07-30", "slug": "1584", "url": "https://thecomearound.wordpress.com/2026/07/30/1584/"}, {"id": "she-stands", "title": "She Stands", "date": "2026-08-17", "slug": "she-stands", "url": "https://thecomearound.wordpress.com/2026/08/17/she-stands/"}, {"id": "do-neem", "title": "Do Neem (The Split)", "date": "2026-09-04", "slug": "do-neem-the-split", "url": "https://thecomearound.wordpress.com/2026/09/04/do-neem-the-split/"}, {"id": "weight-coin", "title": "Weight of the Coin", "date": "2026-09-18", "slug": "weight-of-the-coin", "url": "https://thecomearound.wordpress.com/2026/09/18/weight-of-the-coin/"}];
const EMBEDDED_CONTENT={"knight": {"title": "Knight in shining armour", "date": "2026-03-29", "content": "\n\u003cp class=\"wp-block-paragraph\"\u003eYou came to my gate with a trader’s intent, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWrapped in the shining armor that was only a foil.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA polished surface, thin and crinkled, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHiding a heart that sought only to spoil. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYou wanted the crown, the mortgage, the Amen, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eKing of the castle, you didn’t even build; \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eDemanding the respect again and again, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eUntil the free will I carried was stilled.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut this is the week of the humble entry\u003cstrong\u003e,\u003c/strong\u003e \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd I’ve learned the difference in the shadows of the palms. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe world waited for a Cavalry, a Sentry, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eFor silver-clad soldiers and war-beating psalms. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey wanted a King on a stallion of gold, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eSomeone to mirror their pride and their scars— \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut the True One arrived on a beast, I am told, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWith no need for mirrors, or status, or gold.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYou mistook my \u0026#8220;Yes\u0026#8221; for a land to be conquered, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eLike the Company men on a rich Indian shore. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYou signed your name to the peace that I offered, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThen called it sanctification while you asked for more. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYou preached a gospel of submit and obey, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eUsing the Father to mask your own ego— \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut the King on the donkey shows a different way: \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHe doesn\u0026#8217;t need subjects to make His grace grow.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe Free Pass is over. The treaty is torn. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe 6:30 runner is reclaiming the street. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA sovereign nation is finally reborn, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWith the dust of your proxy kicked off of her feet. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eFor aluminum shrivels when the Truth gets too bright, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd you failed to die for your church from the start. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI’m trading the foil for the Morning Light, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd the King on the donkey for my own healed heart.\u003c/p\u003e\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/03/29/knight-in-shining-armour/"}, "choice": {"title": "Choice that most can’t make at all\u0026#8230;", "date": "2026-05-07", "content": "\n\u003cdiv class=\"wp-block-group has-global-padding is-layout-constrained wp-block-group-is-layout-constrained\"\u003e\n\u003cblockquote class=\"wp-block-quote is-layout-flow wp-block-quote-is-layout-flow\"\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eJaan kehne se koi Jaan nhi hota hai,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eHaan ji \u0026#8230; Jaan kehne se koi Jaan nhi hota hai,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eKoi keh le bhi nuksaan nhi hota hai !!!\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eYe toh mai hoon, k jise chhod diya.. chhod diya\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eYe toh mai hoon, k jise chhod diya.. chhod diya\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eVarna ye faisla aasan nhi hota hai !!!\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/div\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eJust because you called me \u0026#8220;love\u0026#8221; don’t think you held my soul, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWords are cheap, and breath is easy—an effortless role. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThere is no wound in a title, no scar in a hollow name, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnyone can whisper sacrifice, while they’re exiting the frame.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThere is no cost to a whisper, no tax on a lie, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo call someone love as you wave them goodbye.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYou think you walked away, but I’m the one who let you go. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI watched you choose the easy path, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eand I didn\u0026#8217;t say no. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIt takes a certain kind of woman to let a bridge simply burn, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo stand amidst the falling ash and never once look back or turn.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIf it were any other, they’d have shattered at your feet, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey’d have filled the air with salt and tears to make the loss complete. They would have begged, and screamed, and pleaded for the \u0026#8220;us\u0026#8221; we used to be— \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut that’s a brand of desperation that was never meant for me.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eDon’t mistake my steady hands for a heart that doesn\u0026#8217;t feel, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eOr think that being \u0026#8220;left\u0026#8221; has made my spirit any less real. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI simply have too much pride to fight for a space you didn\u0026#8217;t give, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd too much fire in my blood to beg for the right to live.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eGo on and tell your story—tell them that the break was light, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThat I was cold, or reached the end, or didn\u0026#8217;t put up a fight. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut keep this truth behind your teeth: \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eyou only survived the fall, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBecause I’m the one who made a choice that most can’t make at all.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003c/p\u003e\n", "image": "https://thecomearound.wordpress.com/wp-content/uploads/2026/05/1778280780887.png", "source": "https://thecomearound.wordpress.com/2026/05/07/choice-that-most-cant-make-at-all/"}, "idiots": {"title": "I\u0026#8217;m surrounded by idiots!?", "date": "2026-06-29", "content": "\n\u003cp class=\"wp-block-paragraph\"\u003eKaya was taking a peaking into this world of humans on her travels and was captivated by this tale for human offsprings. \u003c/p\u003e\n\n\n\n\u003cfigure class=\"wp-block-image size-large\"\u003e\u003ca href=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg\"\u003e\u003cimg data-attachment-id=\"1544\" data-permalink=\"https://thecomearound.wordpress.com/2026/06/29/im-surrounded-by-idiots/images-1/\" data-orig-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg\" data-orig-size=\"323,156\" data-comments-opened=\"1\" data-image-title=\"images (1)\" data-image-description=\"\" data-image-caption=\"\" data-large-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=323\" loading=\"lazy\" width=\"323\" height=\"156\" src=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=323\" alt=\"\" class=\"wp-image-1544\" srcset=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg 323w, https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=150 150w, https://thecomearound.wordpress.com/wp-content/uploads/2026/06/images-1.jpeg?w=300 300w\" sizes=\"auto, (max-width: 323px) 100vw, 323px\" /\u003e\u003c/a\u003e\u003c/figure\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eMaybe Scar\u0026#8217;s quote resonated and captured that specific, deeply frustrating feeling of being the only one in the room who actually sees the big picture while everyone else is just fumbling around.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eKaya did not hate people. Hating people required a level of emotional investment she simply couldn’t afford to waste. No, Kaya’s affliction was much heavier, much more exhausting: she was simply, undeniably, surrounded by idiots.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe stood in the pristine, limestone archives of the High Cartography Institute, adjusting her magnifying loupe over a massive maritime chart. Around her, senior cartographers fumbled with delicate parchment and leaked standard charcoal ink over the borders as if they were wearing winter mittens. Kaya was the sharpest mind in the sector, a woman who had braved social norms to master the invisible laws of geography, terrain, and the precise, mathematical ratios of her own secret, no-spill ink.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd yet, every single day, she had to watch people smudge the lines.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHer phone vibrated against the marble counter. A message from the border transit office.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026gt; **TRANSIT COURIER REGISTRY:** *Application Denied. Reason: Invalid Sector Coordinates.*\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026gt;\u0026nbsp;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eKaya closed her eyes, the rustle of a hundred heavy parchment maps around the room suddenly sounding like a collective, mocking laugh.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe had spent six figures in local credits—essentially her entire savings from her last major expedition—to secure Sovereign Passports and premium airship transit tokens for her parents and siblings. She wanted them to see her world. She wanted them to stand in the grand archives and finally understand the magnitude of the charts she created.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAll they had to do was fill out a single, standard form. The coordinates of her institute were plastered on the front page of every major civic directory. It was a five-second lookup. Instead, they had guessed. They had written down a completely different district, misspelling the sector name entirely.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e*I am surrounded by idiots,* her mind whispered, the phrase striking like a clean, dull hammer.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIt wasn’t anger; it was the suffocating, hollow realization that they didn\u0026#8217;t even care enough to look. They were content to stay in their small, dusty village, blind to the wild tides of the world, entirely incurious about the girl who mapped the stars.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;Kaya? Are you listening to me?\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe opened her eyes. Standing across the plotting table was Julian, her partner. He was currently holding a beautifully cured leather scroll casing—one he had completely sliced open by using the wrong boundary blade. He looked at her with the wide, helpless eyes of a child who had just dropped a glass jar.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;I tried to trim the borders like you asked,\u0026#8221; Julian mumbled, shifting his weight. \u0026#8220;But it tore. You knew how I was with the delicate leather when you chose to partner with me. Why are you acting so cold about it now?\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eKaya stared at him. This was his favorite defensive shield. *You knew how I was.* A grown man whose entire strategy in a partnership was to weaponize his own incompetence so she would sigh, take the blades from his hands, and do the plotting for him. He didn’t want to learn; he wanted a caretaker to fix his mistakes.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;Clean it up, Julian,\u0026#8221; she said, her voice terrifyingly quiet.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe walked out of the drafting hall, her boots clicking sharply against the stone floor. She needed air. She needed a break from the gravity of everyone else\u0026#8217;s laziness.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut the world outside offered no sanctuary. She owned a small residential complex down the road, a property she managed completely on her own to secure her financial independence. Just this morning, her tenants had sent a formal grievance because the courtyard vines were \u0026#8220;too difficult to prune.\u0026#8221; They expected her—a woman mapping the uncharted territories of the empire—to come over with shears and trim their walkways because basic yard work felt like an impossible riddle to them.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe marched toward the Guild Director’s office to clear her head with raw geographical data. The Director, a man whose title vastly outpaced his intellect, looked up from his heavy mahogany desk.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;Ah, Kaya,\u0026#8221; he smiled, a patronizing, slow expression. \u0026#8220;I saw your petition for the Senior Research Track. Fascinating work on the deep-sea topography grids. Truly intelligent.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;Thank you, Director. I assume the board approved the promotion?\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe Director chuckled, leaning back. \u0026#8220;Oh, we can\u0026#8217;t do that. You see, the Senior Track is a permanent guild line. We don\u0026#8217;t expect highly intelligent, hyper-capable people like yourself to actually stay with a company like ours for the long haul. You\u0026#8217;ll catch a bigger wind, find a grander expedition, and leave us. So, we\u0026#8217;re keeping you right where you are.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eKaya’s breath caught in her throat. The room felt suddenly devoid of oxygen. It was a gilded cage. She was being punished for her excellence, held back because she was too good at her job, while the mediocre pool around her floated effortlessly to the top.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eDesperate for some semblance of grounding, Kaya took the evening transport to the coastal edge of the city to visit her Elder Guardians—the sweet, traditional couple she had adopted as her chosen family. They lived in a beautiful, secluded cottage on the rocky shore, safe from the chaotic politics of the inner city. She thought they, at least, would offer a sanctuary of love.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey sat on the porch, watching the waves crash against the jagged rocks below. Kaya tried to explain the suffocating weight of her week, the isolation of doing everything alone, the desire to find something bigger.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe matriarch adjusted her knitted shawl, her face full of gentle, smothering pity. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;\u003cem\u003eOh, my dear Kaya. \u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eThis is what happens when you try to brave the wild waters of the world. The modern era is full of chaos. If an alliance or a career doesn\u0026#8217;t come directly from a secluded, traditional arrangement from the supreme force—if it isn\u0026#8217;t brought to you safely by the community—it is bound to be corrupt. You must stay on the shore where it\u0026#8217;s safe.\u003c/em\u003e\u0026#8220;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eKaya looked out at the raging ocean. Her knuckles turned white against her teacup reminding of the \u0026#8220;Pearls don\u0026#8217;t lie on the seashore. If you want one, you must dive for it\u0026#8221; she picked from human world. She wanted to respond but it would only make her only family-like visits sour. Maybe she is has had too much influence of this world, doubted Kaya for a minute.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey were well-meaning wardens, but wardens nonetheless. They sat comfortably on the dry sand, never once dipping their toes into the freezing, violent depths, completely unaware that you have to actually survive the terrifying heights of the water if you ever want to reach down and grasp the pearl. They wanted her small as she was growing up. They wanted her compliant, which gave them pride to call her their own. Did they wanted her to mistake safety for peace?\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe phrase returned, louder this time, a steady, rhythmic pulse in her temples.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cstrong\u003e\u003cem\u003eI am surrounded by idiots.\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe weight of their collective inadequacy pressed down on her chest like a concrete block. She was the one paying the credits, she was the one pulling the late nights, she was the one whose precise lines kept the trade ships from crashing into reefs—and yet she was entirely, profoundly alone in the dark.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eKaya stood up, setting her teacup down with a sharp clink. She looked at the gentle, smiling faces of her guardians, then turned her gaze back toward the glittering, chaotic lights of the city.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe realization had fully set in, crushing and absolute. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eNo one was coming to save her. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eNo one was going to help her pull the weight.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eFine ! If she had to carry the world on her back, she would do it. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut she was done pretending the anchors around her ankles were family.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003c/p\u003e\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/06/29/im-surrounded-by-idiots/"}, "love-teeth": {"title": "Love has teeth!", "date": "2026-07-09", "content": "\n\u003cfigure class=\"wp-block-image size-large\"\u003e\u003ca href=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png\"\u003e\u003cimg data-attachment-id=\"1557\" data-permalink=\"https://thecomearound.wordpress.com/2026/07/09/love-has-teeth/attachment/1783643840589/\" data-orig-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png\" data-orig-size=\"848,1264\" data-comments-opened=\"1\" data-image-title=\"1783643840589\" data-image-description=\"\" data-image-caption=\"\" data-large-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=687\" loading=\"lazy\" width=\"687\" height=\"1024\" src=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=687\" alt=\"\" class=\"wp-image-1557\" srcset=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=687 687w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=101 101w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=201 201w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png?w=768 768w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/1783643840589.png 848w\" sizes=\"auto, (max-width: 687px) 100vw, 687px\" /\u003e\u003c/a\u003e\u003c/figure\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe cedar handle of the charting brush creaked under the pressure of Kaya’s grip. She didn\u0026#8217;t realize she was doing it until her knuckles flared stark white against the wood. Across the room, the faint, maddening sound of Julian humming a mindless tune scraped against her nerves like glass on stone. He had just ruined a second vellum scroll by spilling water across the ink-lines, and his immediate response had been a helpless, defensive shrug.\u0026nbsp;\u003cem\u003e“You know how clumsy I am with liquid measures, Kaya. You shouldn\u0026#8217;t have left it on my bench.”\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​A familiar, bitter heat surged from her chest to her jaw. Kaya clenched her teeth so hard her molars ached.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u003cem\u003eI am surrounded by idiots.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​For months, that phrase had been her silent shield. It was the armor she put on every morning to survive the suffocating weight of her life. She had used it to rationalize her family’s careless disregard when they botched the coordinates she paid six figures for. She had used it to numb the pain when her Director blocked her promotion because she was \u0026#8220;too intelligent to risk losing.\u0026#8221; She had used it to endure her Elder Guardians’ soft, paralyzing lectures about staying safe on the shore.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​But as she stood there, watching Julian casually walk away from the mess he expected her to clean, the armor shattered.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​It wasn\u0026#8217;t a shield anymore. It was a mirror.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​With a sudden, jarring clarity, Kaya realized the terrifying truth: the \u0026#8220;pressured-love\u0026#8221; she had been practicing was a lie. She had been taught that to be good, to be noble, to be a protector, meant keeping the peace. It meant smiling through the incompetence, absorbing the chaos of others, and quietly redrawing the maps they ruined so the guild wouldn\u0026#8217;t collapse.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​It wasn\u0026#8217;t virtue. It was a hostage situation. And she was the one volunteering to stay in the cell.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​The sheer weight of the others emotions she had been tolerating rushed over her. By pretending relationships were fine while the evil charade unfolded, she hadn\u0026#8217;t been preserving peace—she had been funding her own slow, psychological death. She felt secure in her routine, yes, but she felt entirely, utterly dead.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Her fist clenched tightly around the brush, the wood groaning a final warning before it snapped neatly in two.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​The sharp\u0026nbsp;\u003cem\u003ecrack\u003c/em\u003e\u0026nbsp;echoed through the silent drafting hall. Julian startled, turning around. \u0026#8220;Kaya? What was that?\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Kaya didn\u0026#8217;t answer. She dropped the broken pieces of the brush onto the table. The heat in her chest suddenly cooled into something terrifyingly sharp, clinical, and absolute. The honest person inside her finally woke up:\u0026nbsp;\u003cem\u003esoulless conformity never leads to life-giving change.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;I’m not cleaning it,\u0026#8221; Kaya said, her voice dropping to a calm, dead pan.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Julian blinked, confused. \u0026#8220;What? But the ink will stain the cedar if it sets—\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;Then let it stain,\u0026#8221; she interrupted, stepping out from behind her desk. For the first time, she didn\u0026#8217;t soften her posture. She didn\u0026#8217;t sigh and reach for the cloth. She let the mess exist. She let \u003cem\u003ehis\u003c/em\u003e failure belong entirely to \u003cem\u003ehim\u003c/em\u003e.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She walked past him without a glance, heading straight for the grand archive doors. She could feel the anchors pulling at her ankles—the thought of her disappointed parents, her patronizing Director, her suffocating guardians—but the ropes were fraying.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​To hate what is wrong meant she had to stop participating in the illusion. If they wanted to live in a world of self-inflicted chaos, they were welcome to it. But they would no longer use her as their safety net.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Kaya reached into her pocket, her fingers brushing against the cold glass vial of her secret, un-spillable ink. She didn\u0026#8217;t need to fight them. She didn\u0026#8217;t need to argue, or scream, or demand they understand her worth. She just had to stop carrying them.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She opened the heavy oak doors, stepping out into the bright, biting air of the city, leaving the midday work behind. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIf she had to brave the wild tides to get the pearl, she would do it completely alone—and for the first time in years, her jaw was unlocked, her hands were open, and she could finally breathe.\u003c/p\u003e\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/07/09/love-has-teeth/"}, "sailing": {"title": "Sailing past the Song", "date": "2026-07-10", "content": "\n\u003cfigure class=\"wp-block-image size-large\"\u003e\u003ca href=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg\"\u003e\u003cimg data-attachment-id=\"1563\" data-permalink=\"https://thecomearound.wordpress.com/2026/07/10/sailing-past-the-song/img-20260710-wa00101/\" data-orig-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg\" data-orig-size=\"1024,1024\" data-comments-opened=\"1\" data-image-meta=\"{\u0026quot;orientation\u0026quot;:\u0026quot;1\u0026quot;}\" data-image-title=\"IMG-20260710-WA0010(1)\" data-image-description=\"\" data-image-caption=\"\" data-large-file=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=1024\" loading=\"lazy\" width=\"1024\" height=\"1024\" src=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=1024\" alt=\"\" class=\"wp-image-1563\" srcset=\"https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg 1024w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=150 150w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=300 300w, https://thecomearound.wordpress.com/wp-content/uploads/2026/07/img-20260710-wa00101.jpg?w=768 768w\" sizes=\"auto, (max-width: 1024px) 100vw, 1024px\" /\u003e\u003c/a\u003e\u003c/figure\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey crowned my head with silver crowns of reason,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey called me brilliant, excellent, and wise.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut \u0026#8220;intelligent\u0026#8221; became a gilded prison,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThat hid the softer hunger in my eyes.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eNo one ever paused to call me pretty,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eNo one ever called me soft or sweet;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI was the fortress of a cold and clever city,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWith heavy iron boots upon my feet.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​I never learned the art of being small,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eOf being playful, childish, or severe.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI was the one who had to know it all,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe razor mind that conquered every fear.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut inside the fortress, hidden in the dark,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA girl’s desires whispered like a prayer:\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo be a woman, leaving just a mark\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eOf helpless, joyful laughter in the air.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​I thought\u0026nbsp;\u003cem\u003eyou\u003c/em\u003e\u0026nbsp;were the key to unlock the gate,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe man who’d let my heavy armor slide.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI thought with you, I’d finally find the weight\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eOf girlish sweetness that I had to hide.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI wanted to be childish, wild, and free,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo be held tightly when the day was done—\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo have you look at me and only see\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA woman, cute and pretty, in the sun.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut here the great and tragic storm awoke,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe paradox of Solomon’s decree:\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI could advise the world, break every yoke,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYet built a cage for my own sovereignty.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eMy daytime mind could map a corporate throne,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd hand you business plans of flawless art,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut in the night, I sat entirely alone,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd used that brilliant mind to wreck my heart.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Because I craved to feel that girlish grace,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eMy logic turned into a traitor\u0026#8217;s knife.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI saw your empty hands, your cold embrace,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd used my intellect to shield your life.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI did the math to justify the text,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI cooked the meals, I froze the ice cream tight,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI thought,\u0026nbsp;\u003cem\u003e\u0026#8220;If I am wise, I can fix what happens next,\u0026#8221;\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd rationalized away your systemic slight.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​My shortcomings were just my virtues spun—\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eMy hope, my naive love, my deep desire.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI used my PhD to prove you were the one,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWhile you were setting all my gifts on fire.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA queen who ruled the data and the chart,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBlinded by a simple, girlish plea—\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI was the wisest guide to someone else\u0026#8217;s heart,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd the executioner of me.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eSo now, the realization strikes the bone,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI cannot trust the girl who wants the kiss.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe Siren song of wanting to be known\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWill pull me back into the dark abyss.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eMy empathy is where the trap is set,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eMy longing to be held will make me yield;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eSo I must forge a pact I won\u0026#8217;t forget,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd lock my softest self behind a shield.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​I plug my ears with beeswax to the strain\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eOf phantom promises and foil design.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI bind my hands with heavy, iron chains,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd tie my body to the sovereign line.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe 6:30 routine is now the rope,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe silent border is the unyielding mast—\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI fasten down the anchors of my hope,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo drown the hollow echoes of the past.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​My heart will scream and beg to be untied,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIt wants the messy bun, the twirl, the shirt.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIt wants to believe the parasite that lied,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo trade its freedom for a familiar hurt.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut Ulysses is captain of the sea,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe ropes will cut, the bleeding hands will hold.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI sail past the song that almost ruined me,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA brilliant woman—pretty, fierce, and bold.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​The plates are cleared. The clock has struck the hour.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe little girl has stepped out of the wild.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYou didn\u0026#8217;t give her love or give her power—\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut the Father holds the woman and lifts the child.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003c/p\u003e\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/07/10/sailing-past-the-song/"}, "trapped": {"title": "Trapped", "date": "2026-07-30", "content": "\n\u003cp class=\"wp-block-paragraph\"\u003eFor six years, the home world had a reliable pulse for Dory. Every single day, without exception, her husband had looked at her and told her he loved her. It was a constant, predictable law of her universe, as certain as gravity. His love was a quiet room, a steady hand, and a lifetime of built safety.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eYet, sitting there with him in the gentle warmth of their home, the conversation turned toward the dark, unmapped terrain of her childhood. The trauma of an abused child doesn\u0026#8217;t disappear just because adult life becomes gentle; in the warmth of his consistency, the old coldness felt even sharper.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​The memory didn\u0026#8217;t fade with time; it just sat beneath the surface of her skin, waiting.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Dory had been an accident of birth, a conception that forced two people into a bitter, early marriage. Her mother\u0026#8217;s response to that trapped life was a cold, unyielding hatred. From the very beginning, Dory was entirely rejected, passed through the uncaring hands of orphanages and two separate foster homes. But the deepest scars were carved in the quiet darkness of a lonely apartment in Oakland, California.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​At only six years old, Dory already carried the crushing weight of a grown woman\u0026#8217;s grief. Her world was defined by waiting in the darkness for her mother to return late at night. Her primary responsibility was protecting her younger sister, Marie. The cruelty of the rejection crystallized in the moments the front door finally clicked open. Her mother would step across the threshold, immediately gathering Marie into a warm, loving hug. When Dory stepped forward, yearning for the same warmth, she was always shoved aside—unwanted, like a stray dog left out in the rain.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She learned early that the sharp, hollow ache of an empty stomach was easier to bear than the emotional devastation of being hated by the person who gave her life. She was never lovingly touched, held, or cuddled. What she knew was different, ugly, and a burden to her mother.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​The apex of the terror came on the nights her mother brought male companions home. To ensure no one would discover that a child was left behind alone, her mother resorted to a clinical, horrifying routine. She would pull the heavy wall bed down, stuff six-year-old Dory into the dark, cramped cavity behind it, and slam the bed back up into the wall. Trapped in the suffocating, dusty void, Dory would cry, gasping for air and clawing at the dark until she finally fell asleep.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​When she turned seven, the abandonment became absolute. Her mother took Marie and Dory to an orphanage nearby and dropped them there like a package at the door. Over the next seven years, she visited them only twice, bringing a gift only for Marie, and none for Dory.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Stranded in the institution, Dory took out all her anger on the other children, earning a bad reputation and receiving a beating usually before bedtime every evening for seven years.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​But when she was thirteen, a brief flicker of hope arrived. Some Christian students came to tell them about Jesus. As they were leaving, one of them said,\u0026nbsp;\u003cem\u003e“Children, even if you forget everything else we have told you, remember God loves you.”\u003c/em\u003e\u0026nbsp;Sitting on a folding chair in the parlor, Dory prayed for the first time in her life. She told God that if he loved her and wanted her, he could have her. On that special day, she thought she became a Christian.\u0026nbsp;\u003cem\u003e“I knew I was received by God,”\u003c/em\u003e\u0026nbsp;she would later say.\u0026nbsp;\u003cem\u003e“At last, I had a friend, a friend forever.”\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​But little did she realize, for the first time in her life outside the orphanage, that the world would be far worse for her than it was within the walls.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She was shunted to four different foster homes. In two of them, she was physically, mentally, and sexually abused. Yet, the religious narrative she had been handed insisted that the God who was with her during her closing days in the orphanage stood with her still.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Now, sitting across from her husband, the teacup rattled against its saucer as Dory set it down. The house was quiet, but her eyes were fixed on the wall, staring right through the present into the dark.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;They told me He was a warrior,\u0026#8221; Dory said, her voice dropping to a harsh, skin-scraping whisper. \u0026#8220;Those students gave me a book filled with a God who breaks things to save the people who cry out to Him. He is the Lord who parted the Red Sea to swallow an entire Egyptian army. He commanded the sun to stand still for Joshua. He shut the mouths of starved lions for Daniel, and stood in the blazing Babylonian furnace so Shadrach, Meshach, and Abednego walked out without even the smell of smoke. He sent an earthquake to shatter the foundations of a prison to free Paul and Silas.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She turned her gaze to her husband, her eyes fiercely, terribly awake.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;If He could rip open the sea, manipulate the cosmos, tame wild beasts, cool the molecular heat of fire, and shatter prison iron—then stopping the hands of vile men in a foster home should have required less than a whisper. Why didn’t He? If He could part the ocean for a million strangers, why couldn\u0026#8217;t He just lock a bedroom door for one little girl who trusted Him?\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Her husband didn\u0026#8217;t offer a platitude. He just held her gaze, letting the heavy truth sit between them.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;The typical answer,\u0026#8221; Dory whispered, her jaw tightening, \u0026#8220;is that He was suffering with me. But that is a lie for cowards. A friend who stands by and watches you get broken because it\u0026#8217;s part of some grand, invisible equation isn\u0026#8217;t a friend at all. That is an accomplice.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She looked down at her hands, the illusion finally shattering completely under the weight of honest psychology.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;This God is no better than an imaginary friend,\u0026#8221; she said, the words cutting through the quiet room like a scalpel. \u0026#8220;The psychology says that when you fear and go through immense trauma that your brain cannot bear, so in order to protect itself from going insane and losing the grasp of reality, it creates an imaginary situation or a person or anything imaginary where it can feel the comfort and love and all the lackings that it that a person is not receiving. So what is to say that God is just an imaginary construct or any better than that?\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She looked at her husband, the clinical truth giving her a cold, unbreakable clarity.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;It’s called structural dissociation. My brain fractured itself to keep me from shattering. It created a fantasy defense—an inner sanctuary with an imaginary guardian—because the alternative was total psychological death. My cognitive architecture was just trying to detect a protector in an empty room because it was hardwired to survive. It wasn\u0026#8217;t the Holy Spirit visiting a thirteen-year-old girl; it was a traumatized ego deploying every defense mechanism it had left.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She let out a long, slow breath, her shoulders dropping as the ancient, cosmic guilt poured out of her.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;I didn\u0026#8217;t survive because of a miracle,\u0026#8221; Dory said, looking her husband dead in the eye, finally claiming her own immense, terrifying strength. \u0026#8220;My brain did what it had to do to keep that little girl in the wall bed from breaking. He didn\u0026#8217;t keep me safe. I kept me safe. My own mind fought for me until I was strong enough to walk out of the dark and find a reality that was finally real.\u0026#8221;​\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;This God is no better than an imaginary friend,\u0026#8221; she said, the words cutting through the quiet room like a scalpel. \u0026#8220;The psychology says that when you fear and go through immense trauma that your brain cannot bear, so in order to protect itself from going insane and losing the grasp of reality, it creates an imaginary situation or a person or anything imaginary where it can feel the comfort and love and all the lackings that it that a person is not receiving. So what is to say that God is just an imaginary construct or any better than that?\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She looked at her husband, the clinical truth giving her a cold, unbreakable clarity.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;It’s called structural dissociation. My brain fractured itself to keep me from shattering. It created a fantasy defense—an inner sanctuary with an imaginary guardian—because the alternative was total psychological death. My cognitive architecture was just trying to detect a protector in an empty room because it was hardwired to survive. It wasn\u0026#8217;t the Holy Spirit visiting a thirteen-year-old girl; it was a traumatized ego deploying every defense mechanism it had left.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She let out a long, slow breath, her shoulders dropping as the ancient, cosmic guilt poured out of her.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​\u0026#8221;I didn\u0026#8217;t survive because of a miracle,\u0026#8221; Dory said, looking her husband dead in the eye, finally claiming her own immense, terrifying strength. \u0026#8220;My brain did what it had to do to keep that little girl in the wall bed from breaking. He didn\u0026#8217;t keep me safe.\u0026nbsp;\u003cem\u003eI\u003c/em\u003e\u0026nbsp;kept me safe. My own mind fought for me until I was strong enough to walk out of the dark and find a reality that was finally real.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;They will tell you there is proof,\u0026#8221; Dory said, her voice rising slightly, carrying the weight of decades of reading, researching, and trying to make the pieces fit. \u0026#8220;Apologists point to the geography of the Levant as if a map is an validation of a miracle. They tell you to look at the Jordan River where Jesus was baptized, or the dry stones of Israel where he walked. They point to the gnarled, ancient roots of the Garden of Gethsemane where he wept before the crucifixion.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​She gestured out the window, as if pointing to the thousands of libraries across the world. \u0026#8220;I looked into it. I read their proofs. They will give you endless coordinates:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e​The\u0026nbsp;\u003cstrong\u003ePool of Siloam\u003c/strong\u003e\u0026nbsp;in Jerusalem, where the blind man supposedly washed and gained his sight.\u003c/li\u003e\n\n\n\n\u003cli\u003e​The rocky hill of\u0026nbsp;\u003cstrong\u003eGolgotha\u003c/strong\u003e, the place of the skull, where the crosses physically stood.\u003c/li\u003e\n\n\n\n\u003cli\u003e​The ancient town of\u0026nbsp;\u003cstrong\u003eCapernaum\u003c/strong\u003e, the ruins of the synagogue where he cast out spirits.\u003c/li\u003e\n\n\n\n\u003cli\u003e​The\u0026nbsp;\u003cstrong\u003eSea of Galilee\u003c/strong\u003e, a real, wind-swept body of water where fishermen cast their nets.\u003c/li\u003e\n\n\n\n\u003cli\u003e​The\u0026nbsp;\u003cstrong\u003eChurch of the Holy Sepulchre\u003c/strong\u003e, built over the very tomb they claim was left empty.\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​They look at these real, physical places and say,\u0026nbsp;\u003cem\u003e\u0026#8216;See? The setting is real, so the magic must be real too.\u0026#8217;\u003c/em\u003e\u0026#8220;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Dory leaned forward, her fingers tapping the wooden table with a sharp, rhythmic finality. \u0026#8220;But that is a flaw in elementary logic. Because if real geography proves a god, then every god on earth is alive.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Look at the Indian subcontinent. The\u0026nbsp;\u003cstrong\u003eRam Setu\u003c/strong\u003e, the chain of limestone shoals stretching between the southern tip of India and Sri Lanka, is entirely real—visible from satellites, exactly where the ancient Hindu epics said Rama built a bridge to rescue his wife. If we travel across India, we find the pillars of\u0026nbsp;\u003cstrong\u003eMahabalipuram\u003c/strong\u003e, the sacred banks of the\u0026nbsp;\u003cstrong\u003eVaranasi Ghats\u003c/strong\u003e\u0026nbsp;along the Ganges where rituals have burned for millennia, the ancient caves of\u0026nbsp;\u003cstrong\u003eKedarnath\u003c/strong\u003e\u0026nbsp;hidden high in the Himalayas, and the ruins of\u0026nbsp;\u003cstrong\u003eAyodhya\u003c/strong\u003e. If a physical landmark proves a theological claim, then the entire Hindu pantheon must be ruling the cosmos right now.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​And what of Islam?\u0026nbsp;\u003cstrong\u003eMecca and Medina\u003c/strong\u003e\u0026nbsp;are absolute realities. The\u0026nbsp;\u003cstrong\u003eKaaba\u003c/strong\u003e\u0026nbsp;stands in the center of the Grand Mosque, a physical focal point for billions. Millions of pilgrims march between the hills of\u0026nbsp;\u003cstrong\u003eSafa and Marwa\u003c/strong\u003e, retracing the desperate search of Hagar for water. They gather at the\u0026nbsp;\u003cstrong\u003eMount of Arafat\u003c/strong\u003e, the very hill where Muhammad delivered his farewell sermon. They walk the plains of\u0026nbsp;\u003cstrong\u003eMina\u003c/strong\u003e\u0026nbsp;and visit the ancient\u0026nbsp;\u003cstrong\u003eWell of Zamzam\u003c/strong\u003e, which still flows with water today. By the same logic, the text of the Quran is validated purely because the sand and the stones are where they said they were.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Go further east to Buddhism. The ancient\u0026nbsp;\u003cstrong\u003eMaha Bodhi Temple in Bodh Gaya\u003c/strong\u003e\u0026nbsp;stands precisely where Siddhartha Gautama sat under the Bodhi tree and achieved enlightenment. The ruins of the\u0026nbsp;\u003cstrong\u003eJetavana monastery\u003c/strong\u003e\u0026nbsp;in Sravasti, where the Buddha spent most of his monastic life, are excavated and real. You can walk through\u0026nbsp;\u003cstrong\u003eSarnath\u003c/strong\u003e, the deer park where he preached his very first sermon, visit the\u0026nbsp;\u003cstrong\u003eDhamekh Stupa\u003c/strong\u003e\u0026nbsp;built to mark the spot, and touch the stone ruins of\u0026nbsp;\u003cstrong\u003eKushinagar\u003c/strong\u003e, the physical place where he died.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Even Jainism, rooted in deep antiquity, leaves an undeniable physical footprint. The massive stone temples of\u0026nbsp;\u003cstrong\u003eDilwara\u003c/strong\u003e\u0026nbsp;are carved into the rocks of Mount Abu. The ancient monolithic statue of\u0026nbsp;\u003cstrong\u003eBahubali at Shravanabelagola\u003c/strong\u003e\u0026nbsp;has stood for over a thousand years, carved out of a single granite hill. Pilgrims climb the rugged peaks of\u0026nbsp;\u003cstrong\u003eShikharji\u003c/strong\u003e, the holy mountain where twenty of the twenty-four Tirthankaras achieved liberation from the cycle of rebirth.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Every single belief system has its landmarks,\u0026#8221; Dory whispered, her eyes dark and steady. \u0026#8220;Every religion has its rivers, its mountains, its footprints in the mud, and its ancient ruins. The geography is real because humans live in a real world. We build altars where we suffer, and we give divine names to the mountains we climb.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​But a real river does not mean a man walked on water. A real mountain does not mean a god spoke from a cloud. And the existence of Israel or Mecca or a bridge in the ocean doesn\u0026#8217;t change the fact that when a child was screaming for help in a locked room, the sky was completely empty.\u0026#8221;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eDory\u0026#8217;s husband couldn\u0026#8217;t muster to say anything reasonable or logical, to counter her but only stretched out his hands \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003earound her waist \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003epulling her close, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eleaning his head against hers and \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003emumbling the words \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026#8220;Our father who art in heaven\u0026#8230;\u0026#8221;\u003c/p\u003e\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/07/30/1584/"}, "she-stands": {"title": "She stands \u0026#8230;", "date": "2026-08-17", "content": "\n\u003cp class=\"wp-block-paragraph\"\u003eSo back she goes to her old ways,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u0026nbsp;of\u0026nbsp;\u003cspan style=\"font-size: inherit\"\u003efending for herself,\u003c/span\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003edefending for herself,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003elaughing at herself,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003ecrying by herself,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eshutting everything and\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eeveryone out,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003ehurt them before they hurt her.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe may have not known real joy or happiness\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003ebefore but now she is stripped off of\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eany hope.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eJesus Christ was her one last hope and she\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003edid everything with her faith firm in this\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003erelationship,\u0026nbsp;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003ebeing firm to love someone\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003ebroken and invalid,\u0026nbsp;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eloving despite her\u0026nbsp;\u003cspan style=\"font-size: inherit\"\u003ebrokenness and incapacity.\u003c/span\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eNow all that is gone.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd she stands\u0026#8230;\u0026nbsp;\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eto bear the burden\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eto stand against him and\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003estrip him of the power of love she\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eonce surrendered happily and willingly\u003c/p\u003e\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/08/17/she-stands/"}, "do-neem": {"title": "Do Neem (The Split)", "date": "2026-09-04", "content": "\n\u003cp class=\"wp-block-paragraph\"\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003e​Duniya ne sikhaya ki aurat ko batna padta hai,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eApni hi rooh ke do hisse karke jeena padta hai.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe was told She must divide her life in two,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo pick which half of her gets to survive.\u003c/p\u003e\n\n\n\n\u003chr class=\"wp-block-separator has-alpha-channel-opacity\" /\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eYa toh naram hawayein chuno, jinme zindagi ki barish na ho,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eYa sang-e-marmar ki aisi chhat, jahan dhadkan ki gunjaish na ho.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo choose a gentle hand that has no path,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eOr a sturdy roof where no love can thrive.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​With one, the night was warm, the words were soft,\u003c/p\u003e\n\n\n\n\u003chr class=\"wp-block-separator has-alpha-channel-opacity\" /\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003e​Ek shakhs mila, jiske lafz shabnam aur raatein makhmal thi,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eUsne maathe ki shikan toh choom li, par sehar ka bojh mujh par chhod diya.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eUsne haath toh thama, par zindagi ki gadi mujh par chhod di,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eUske be-fikr aangan ko roshan rakhne ki khatir, maine apne wajood ko jala diya.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHe held my heart, but left my hands to build.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI carried all the weight, the bills, the home,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eUntil the warmth we had was slowly chilled.\u003c/p\u003e\n\n\n\n\u003chr class=\"wp-block-separator has-alpha-channel-opacity\" /\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003e​Doosra woh tha, jiske sange-marmar mahal ki deewarein Unchi thi,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eDuniya ne uske rutbe aur sone ke darwazon par salam kiya.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003ePar us aali-shaan thikane mein, meri rooh barf mein tabdeel ho gayi,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eUsne aasaish toh di, par meri  befikre masoomiyat ko dafan kar diya.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eWoh rishta nahi, dilon ka nahi, bas ek kaagzi sauda sa tha,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eAur main us sangemarmar ke qile mein, ek sangemarmar ki malka thi.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eWith the other, all on the papers looked so right,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA house of stone, a title, and a name.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut inside those walls, the air grew ice,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd my gentle free spirit was bound inside.\u003c/p\u003e\n\n\n\n\u003chr class=\"wp-block-separator has-alpha-channel-opacity\" /\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003e​Zamana kehta hai, aaj ki kaabil aurat ka yahi naseeb hai\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eYa mohabbat ke badle apna khoon-paseena girwi rakh de, \u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eya hifazat ke badle apne jazbaat.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eAur main in aade-adhure paimanon ke beech ghutti rahi,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eEk jahan jo muqammal hone ki zid karta tha, is fareb mein tadapta rahi.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey said:\u0026nbsp;\u003cem\u003e\u0026#8220;A woman cannot have it all—\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003cem\u003eSettle for a lover, or settle for a cage.\u0026#8221;\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd so I suffocated in the split,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTrapped between the warmth and the page.\u003c/p\u003e\n\n\n\n\u003chr class=\"wp-block-separator has-alpha-channel-opacity\" /\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003e​Par ab, kisi khokhli neev par mera aashiyana nahi banega,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eKisi thande saaye ko garmi dene ke liye, mera aansoo nahi jalega.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eNa main bojh uthaungi, na kisi pinjre mein saans rok kar baithungi,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eMaine aadhe aasmaan se samjhauta karna chhod diya hai.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003e​Mujhe mazboot chhat k sath thikana bhi chahiye, aur sardi ki dhoop si narmi bhi,\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eJo ishq aurat ko tod de, bahaane banaye, woh meri manzil nahi.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eAb yeh safar aakhiri sach ki taraf mudega\u003c/em\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e\u003cem\u003eYa toh muqammal milega, ya yeh ladki khud apni mehboob rahegi.\u003c/em\u003e\u003c/p\u003e\n\n\n\n\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIt looked so right,\u003cbr\u003eA house of stone, a title, and a name.\u003cbr\u003eBut inside those walls, the air grew ice,\u003cbr\u003eAnd my gentle free spirit was bound inside.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe world says this is the fate of today’s capable woman:\u003cbr\u003eShe must either mortgage her blood and sweat in exchange for love,\u003cbr\u003eOr mortgage her emotions in exchange for safety.\u003cbr\u003eAnd I suffocated between these half-baked standards,\u003cbr\u003eAgonizing in the delusion of a world that insisted on calling itself complete.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThey said: “A woman cannot have it all—\u003cbr\u003eSettle for a lover, or settle for a cage.”\u003cbr\u003eAnd so I suffocated in the split,\u003cbr\u003eTrapped between the warmth and the page.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut now, my nest will not be built on a hollow foundation,\u003cbr\u003eNor will my tears burn to warm a cold shadow.\u003cbr\u003eI will neither carry the burden nor sit breathless in a cage,\u003cbr\u003eI have stopped compromising for half a sky.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eI need a home with a sturdy roof, but also the softness of winter sunshine,\u003cbr\u003eThe love that breaks a woman and makes excuses is not my destination.\u003cbr\u003eNow this journey will turn toward the ultimate truth—\u003cbr\u003eEither I will get what is complete, or this girl will remain her own beloved.\u003c/p\u003e\n", "image": "https://thecomearound.wordpress.com/wp-content/uploads/2026/09/1788554528532.png", "source": "https://thecomearound.wordpress.com/2026/09/04/do-neem-the-split/"}, "weight-coin": {"title": "Weight of the coin.", "date": "2026-09-18", "content": "\n\u003cp class=\"wp-block-paragraph\"\u003e\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e​“Maangan gaye so mar rahe, mare jo maangan jaahi…”\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e(Those who go to beg are dying, and dead are those who beg\u0026#8230;  -Kabir)\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e​\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe was taught early that a stretched hand is a broken spine,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThat taking favors from the world will blur the sovereign line.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe knew that for a woman in this world, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003echarity always comes with a cage.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Now the seals of the windows are cracking, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003ewinter is creeping in.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe house is unkept, the bills sit heavy on the wooden table,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eA quiet, suffocating mountain she no longer feels able to move.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd standing at the edge of these ruins is the man who broke the home,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHolding out a quiet coin, offering to pay the toll.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003ewhen the bond was alive, she carried her weight,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe paid the price of his presence, she managed the estate.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eNow he wishes to returns as a savior, \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eoffering cash for the breaking walls,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eAnd the torment inside her fractures every time he calls.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​Oh, the body begs to take it. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eThe exhaustion is so deep.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe desperately wants to be cared for, she wants to finally sleep.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe craves the relief of a man who steps in to fix the leak,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eTo feel the comfort of support, to be allowed to just be weak.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​But the coin in his hand does not look like love. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eIt looks like a master’s chain.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHow do you accept an umbrella from the man who summoned the rain?\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHer principles rise up, rigid and cruel in her defense.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe cannot take his money without swallowing her soul,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe cannot buy her comfort by paying his hidden toll.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e​It is a terrible, lonely curse to be a woman made of self-respect.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe wants the help so badly, she could weep on the open floor,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eBut her hands refuse to reach for the charity at the door.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eShe will fix the broken seals with her own bleeding hands,\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eStarving in her sovereignty, exactly where she stands.\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eKhuddari Aur Khairat\u003cbr\u003eKabir ke dohe gungunati hui badi hui thi woh,\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eEk sookhi, par oonchi anaa pe khadi hui thi woh.\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eKyunki duniya jab madad karti hai, toh keemat rooh ki maangti hai\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eGhar ki chhat tapak rahi hai, deewaron par silan ka raaj hai.\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003e​Kal tak jo humari kamayi se ghar chala raha tha,\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eAaj woh meri bebasi par mujhe khairat baantne chala hai.\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eDil cheekh kar kehta hai, bas ab aur bojh mat utha.\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eEk pal ko lagta hai uske diye hue paise rakh loon,\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eIs toote hue aashiyane ki bikharti neev kass loon.\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eZaroorat aur usoolon ki is khaufnaak jung mein,\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eJism rehm ki bheekh mangta hai, \u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003epar zameer baghawat kar deta hai\u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003eFaake manzoor hain, \u003c/p\u003e\n\n\n\n\u003cp class=\"has-text-align-right wp-block-paragraph\"\u003etapakti chhat manzoor hai, par uski reham ki bheekh nahi.\u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003e\u003c/p\u003e\n", "image": "", "source": "https://thecomearound.wordpress.com/2026/09/18/weight-of-the-coin/"}};
const $=id=>document.getElementById(id), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prettyDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
function sanitize(html){const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');doc.querySelectorAll('script,style,form,button,object,embed,link,meta').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(el=>{for(const a of [...el.attributes]){if(a.name.startsWith('on')||a.name==='srcdoc'||(a.name==='style'&&!/^(text-align|white-space):/i.test(a.value)))el.removeAttribute(a.name);if(['href','src','poster'].includes(a.name)&&/^\s*(javascript|data):/i.test(a.value))el.removeAttribute(a.name);}if(el.tagName==='A'){el.target='_blank';el.rel='noopener noreferrer'}});return doc.body.firstElementChild.innerHTML;}
async function getJSON(url){const r=await fetch(url,{mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
async function loadPost(p){if(EMBEDDED_CONTENT[p.id])return EMBEDDED_CONTENT[p.id];try{const v=await getJSON('data/'+p.id+'.json');if(v.content)return v;}catch(e){};
 const api=[`${BASE}/wp-json/wp/v2/posts?slug=${encodeURIComponent(p.slug)}&_embed=1`, `https://public-api.wordpress.com/rest/v1.1/sites/thecomearound.wordpress.com/posts/slug:${encodeURIComponent(p.slug)}`];
 for(let i=0;i<api.length;i++){try{const d=await getJSON(api[i]);if(i===0){const x=Array.isArray(d)?d[0]:null;if(!x?.content?.rendered)continue;return {content:x.content.rendered,title:x.title?.rendered,date:x.date,image:x._embedded?.['wp:featuredmedia']?.[0]?.source_url||null,live:true};}else if(d?.content)return {content:d.content,title:d.title,date:d.date,image:d.featured_image||null,live:true};}catch(e){console.warn('Post source unavailable',p.slug,e.message);}}
 return null;}
function drawTabs(){const query=$('search').value.toLowerCase();$('tabs').innerHTML=posts.filter(p=>p.title.toLowerCase().includes(query)).map(p=>`<button class="tab" role="tab" aria-selected="${p.id===chosen}" data-id="${escapeHTML(p.id)}"><span>${escapeHTML(p.title)}</span><small>${prettyDate(p.date)}</small></button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.id)));}
async function navigate(id){const p=posts.find(p=>p.id===id)||posts[0];if(!p)return;chosen=p.id;history.replaceState(null,'','#'+p.id);drawTabs();$('sidebar').classList.remove('expanded');$('toggleMenu').setAttribute('aria-expanded','false');$('content').innerHTML=`<article><div class="eyebrow">Poetry · prose · reflections</div><h1>${escapeHTML(p.title)}</h1><div class="date">${prettyDate(p.date)}</div><p class="muted">Loading the writing…</p></article>`;
 const v=await loadPost(p);if(chosen!==p.id)return;
 const title=v?.title?new DOMParser().parseFromString(v.title,'text/html').body.textContent:p.title;
 const srcLink=`<a href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">Original WordPress publication ↗</a>`;
 if(!v){$('content').innerHTML=`<article class="empty"><div class="eyebrow">Collected writing</div><h1>${escapeHTML(p.title)}</h1><div class="date">${prettyDate(p.date)}</div><div class="notice" style="margin-top:35px">This post could not be retrieved from WordPress. The tab is ready, but its full text has not been stored locally yet. ${srcLink}<p>For a permanent independent copy, run the included <code>scripts/snapshot.py</code> on a computer with internet access, then commit the generated <code>data/</code> files.</p></div></article>`;return;}
 const body=sanitize(v.content);const hasImage=/<img/i.test(body);const hero=v.image&&!hasImage?`<img class="hero" src="${escapeHTML(v.image)}" alt="Artwork for ${escapeHTML(title)}" loading="lazy">`:'';
 $('content').innerHTML=`<article><div class="eyebrow">Collected writing</div><h1>${escapeHTML(title)}</h1><div class="date">${prettyDate(p.date)}</div>${hero}<div class="prose" id="postText" style="font-size:${fontSize}px">${body}</div><div class="credit">Written by Shayara · ${srcLink}${v.live?' <span class="muted">· Loaded from original publication</span>':''}</div></article>`;
}
function init(){posts=EMBEDDED_POSTS;drawTabs();navigate(location.hash.slice(1)||posts[0].id)}
$('search').addEventListener('input',drawTabs);$('toggleMenu').addEventListener('click',()=>{const expanded=$('sidebar').classList.toggle('expanded');$('toggleMenu').setAttribute('aria-expanded',String(expanded))});$('smaller').onclick=()=>{fontSize=Math.max(14,fontSize-1);if($('postText'))$('postText').style.fontSize=fontSize+'px'};$('larger').onclick=()=>{fontSize=Math.min(25,fontSize+1);if($('postText'))$('postText').style.fontSize=fontSize+'px'};$('share').onclick=()=>{navigator.clipboard?.writeText(location.href).then(()=>{$('share').textContent='Copied ✓';setTimeout(()=>$('share').textContent='Share ↗',1400)}).catch(()=>{prompt('Copy this link:',location.href)})};window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));init();
</script></body></html>
